<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="__FAVICON__">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>SPH Activity Dashboard</title>
<meta name="description" content="View and filter every Bristol &amp; Beyond Stronger Practice Hub activity running in 2026-2027.">

<style>
/* ============================================================== Fluent 2
   Token values are taken from @fluentui/tokens: the type ramp, corner radii,
   stroke widths, spacing, elevation formulas, motion curves and the neutral
   greys. The brand ramp is the Bristol & Beyond blue shaped to Fluent's own
   ramp, so the system is themed rather than wearing Microsoft's product blue.
   ---------------------------------------------------------------------- */
:root {
  /* Scrollbars and native control internals follow the theme too. */
  color-scheme: light;

  /* -- type ------------------------------------------------------------ */
  --fontFamilyBase: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
  --fontFamilyDisplay: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
  --fontFamilyMonospace: "Cascadia Mono", Consolas, "Courier New", Courier, monospace;

  --fontSizeBase100: 10px;
  --fontSizeBase200: 12px;
  --fontSizeBase300: 14px;
  --fontSizeBase400: 16px;
  --fontSizeBase500: 20px;
  --fontSizeBase600: 24px;
  --fontSizeHero700: 28px;

  --lineHeightBase100: 14px;
  --lineHeightBase200: 16px;
  --lineHeightBase300: 20px;
  --lineHeightBase400: 22px;
  --lineHeightBase500: 26px;
  --lineHeightBase600: 32px;
  --lineHeightHero700: 36px;

  --fontWeightRegular: 400;
  --fontWeightMedium: 500;
  --fontWeightSemibold: 600;

  /* -- shape and space -------------------------------------------------- */
  --borderRadiusNone: 0;
  --borderRadiusSmall: 2px;
  --borderRadiusMedium: 4px;
  --borderRadiusLarge: 6px;
  --borderRadiusXLarge: 8px;
  --borderRadiusCircular: 10000px;

  --strokeWidthThin: 1px;
  --strokeWidthThick: 2px;

  --spacingXXS: 2px;
  --spacingXS: 4px;
  --spacingSNudge: 6px;
  --spacingS: 8px;
  --spacingMNudge: 10px;
  --spacingM: 12px;
  --spacingL: 16px;
  --spacingXL: 20px;
  --spacingXXL: 24px;
  --spacingXXXL: 32px;

  /* -- motion ----------------------------------------------------------- */
  --durationFaster: 100ms;
  --durationFast: 150ms;
  --durationNormal: 200ms;
  --durationGentle: 250ms;
  --curveEasyEase: cubic-bezier(0.33, 0, 0.67, 1);
  --curveDecelerateMid: cubic-bezier(0, 0, 0, 1);
  --curveAccelerateMid: cubic-bezier(1, 0, 1, 1);

  /* -- neutrals --------------------------------------------------------- */
  --colorNeutralBackground1: #ffffff;
  --colorNeutralBackground1Hover: #f5f5f5;
  --colorNeutralBackground1Pressed: #e0e0e0;
  --colorNeutralBackground2: #fafafa;
  --colorNeutralBackground3: #f5f5f5;
  --colorNeutralBackground4: #f0f0f0;
  --colorNeutralBackground5: #ebebeb;
  --colorNeutralBackground6: #e6e6e6;
  --colorSubtleBackgroundHover: #f5f5f5;
  --colorSubtleBackgroundPressed: #e0e0e0;

  --colorNeutralForeground1: #242424;
  --colorNeutralForeground2: #424242;
  --colorNeutralForeground3: #616161;
  --colorNeutralForeground4: #707070;
  --colorNeutralForegroundDisabled: #bdbdbd;
  --colorNeutralForegroundOnBrand: #ffffff;

  --colorNeutralStroke1: #d1d1d1;
  --colorNeutralStroke1Hover: #c7c7c7;
  --colorNeutralStroke2: #e0e0e0;
  --colorNeutralStroke3: #f0f0f0;
  --colorNeutralStrokeAccessible: #616161;
  --colorStrokeFocus2: #000000;
  --colorBackgroundOverlay: rgba(0, 0, 0, 0.4);

  /* -- brand: Bristol & Beyond blue on Fluent's ramp -------------------- */
  --colorBrandBackground: #224c7f;        /* brand 80  */
  --colorBrandBackgroundHover: #20436e;   /* brand 70  */
  --colorBrandBackgroundPressed: #1c3a5f; /* brand 60  */
  --colorBrandBackground2: #eef3f9;       /* brand 160 */
  --colorBrandForeground1: #224c7f;
  --colorBrandStroke1: #224c7f;
  --colorBrandStroke2: #b8d0ed;           /* brand 140 */
  --colorCompoundBrandStroke: #224c7f;

  /* -- elevation: ambient + key, per Fluent's shadow formula ------------ */
  --shadowAmbient: rgba(0, 0, 0, 0.12);
  --shadowKey: rgba(0, 0, 0, 0.14);

  /* -- status: Fluent shared ramps, one hue per spreadsheet fill -------- */
  --live-fg: #0e700e;        --live-bg: #f1faf1;        --live-stroke: #9fd89f;
  --ticketing-fg: #532982;   --ticketing-bg: #f7f4fb;   --ticketing-stroke: #c6b1de;
  --built-fg: #037679;       --built-bg: #f0fafa;       --built-stroke: #9bd9db;
  --new-fg: #835b00;         --new-bg: #fefbf4;         --new-stroke: #f9e2ae;
  --later-fg: #c43501;       --later-bg: #fdf6f3;       --later-stroke: #f4bfab;
  --cpd-fg: #b10e1c;         --cpd-bg: #fdf3f4;         --cpd-stroke: #eeacb2;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --colorNeutralBackground1: #292929;
    --colorNeutralBackground1Hover: #383838;
    --colorNeutralBackground1Pressed: #2e2e2e;
    --colorNeutralBackground2: #1f1f1f;
    --colorNeutralBackground3: #141414;
    --colorNeutralBackground4: #0a0a0a;
    --colorNeutralBackground5: #000000;
    --colorNeutralBackground6: #333333;
    --colorSubtleBackgroundHover: #383838;
    --colorSubtleBackgroundPressed: #2e2e2e;

    --colorNeutralForeground1: #ffffff;
    --colorNeutralForeground2: #d6d6d6;
    --colorNeutralForeground3: #adadad;
    --colorNeutralForeground4: #999999;
    --colorNeutralForegroundDisabled: #5c5c5c;
    --colorNeutralForegroundOnBrand: #ffffff;

    --colorNeutralStroke1: #666666;
    --colorNeutralStroke1Hover: #757575;
    --colorNeutralStroke2: #525252;
    --colorNeutralStroke3: #3d3d3d;
    --colorNeutralStrokeAccessible: #adadad;
    --colorStrokeFocus2: #ffffff;
    --colorBackgroundOverlay: rgba(0, 0, 0, 0.5);

    --colorBrandBackground: #20436e;
    --colorBrandBackgroundHover: #224c7f;
    --colorBrandBackgroundPressed: #1c3a5f;
    --colorBrandBackground2: #101f32;
    --colorBrandForeground1: #689bd9;
    --colorBrandStroke1: #4e8bd4;
    --colorBrandStroke2: #20436e;
    --colorCompoundBrandStroke: #4e8bd4;

    --shadowAmbient: rgba(0, 0, 0, 0.24);
    --shadowKey: rgba(0, 0, 0, 0.28);

    --live-fg: #54b054;      --live-bg: #0b2e0b;      --live-stroke: #0e700e;
    --ticketing-fg: #c6b1de; --ticketing-bg: #281844; --ticketing-stroke: #532982;
    --built-fg: #4cb4b7;     --built-bg: #052e30;     --built-stroke: #037679;
    --new-fg: #f2c661;       --new-bg: #33280a;       --new-stroke: #835b00;
    --later-fg: #e9835e;     --later-bg: #33150a;     --later-stroke: #c43501;
    --cpd-fg: #ea6b8a;       --cpd-bg: #3b0a17;       --cpd-stroke: #a01b39;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --colorNeutralBackground1: #292929;
  --colorNeutralBackground1Hover: #383838;
  --colorNeutralBackground1Pressed: #2e2e2e;
  --colorNeutralBackground2: #1f1f1f;
  --colorNeutralBackground3: #141414;
  --colorNeutralBackground4: #0a0a0a;
  --colorNeutralBackground5: #000000;
  --colorNeutralBackground6: #333333;
  --colorSubtleBackgroundHover: #383838;
  --colorSubtleBackgroundPressed: #2e2e2e;

  --colorNeutralForeground1: #ffffff;
  --colorNeutralForeground2: #d6d6d6;
  --colorNeutralForeground3: #adadad;
  --colorNeutralForeground4: #999999;
  --colorNeutralForegroundDisabled: #5c5c5c;
  --colorNeutralForegroundOnBrand: #ffffff;

  --colorNeutralStroke1: #666666;
  --colorNeutralStroke1Hover: #757575;
  --colorNeutralStroke2: #525252;
  --colorNeutralStroke3: #3d3d3d;
  --colorNeutralStrokeAccessible: #adadad;
  --colorStrokeFocus2: #ffffff;
  --colorBackgroundOverlay: rgba(0, 0, 0, 0.5);

  --colorBrandBackground: #20436e;
  --colorBrandBackgroundHover: #224c7f;
  --colorBrandBackgroundPressed: #1c3a5f;
  --colorBrandBackground2: #101f32;
  --colorBrandForeground1: #689bd9;
  --colorBrandStroke1: #4e8bd4;
  --colorBrandStroke2: #20436e;
  --colorCompoundBrandStroke: #4e8bd4;

  --shadowAmbient: rgba(0, 0, 0, 0.24);
  --shadowKey: rgba(0, 0, 0, 0.28);

  --live-fg: #54b054;      --live-bg: #0b2e0b;      --live-stroke: #0e700e;
  --ticketing-fg: #c6b1de; --ticketing-bg: #281844; --ticketing-stroke: #532982;
  --built-fg: #4cb4b7;     --built-bg: #052e30;     --built-stroke: #037679;
  --new-fg: #f2c661;       --new-bg: #33280a;       --new-stroke: #835b00;
  --later-fg: #e9835e;     --later-bg: #33150a;     --later-stroke: #c43501;
  --cpd-fg: #ea6b8a;       --cpd-bg: #3b0a17;       --cpd-stroke: #a01b39;
}

/* Fluent builds every shadow from a soft ambient layer and a sharp key one. */
:root {
  --shadow2: 0 0 2px var(--shadowAmbient), 0 1px 2px var(--shadowKey);
  --shadow4: 0 0 2px var(--shadowAmbient), 0 2px 4px var(--shadowKey);
  --shadow8: 0 0 2px var(--shadowAmbient), 0 4px 8px var(--shadowKey);
  --shadow16: 0 0 2px var(--shadowAmbient), 0 8px 16px var(--shadowKey);
  --shadow64: 0 0 8px var(--shadowAmbient), 0 32px 64px var(--shadowKey);
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--colorNeutralBackground3);
  color: var(--colorNeutralForeground1);
  font-family: var(--fontFamilyBase);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  font-weight: var(--fontWeightRegular);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 {
  font-family: var(--fontFamilyDisplay);
  margin: 0;
  font-weight: var(--fontWeightSemibold);
  text-wrap: balance;
}

button, input, select { font: inherit; color: inherit; }
a { color: var(--colorBrandForeground1); }

/* Fluent's focus indicator: a thick ring in the opposing neutral. */
:focus-visible {
  outline: var(--strokeWidthThick) solid var(--colorStrokeFocus2);
  outline-offset: 1px;
  border-radius: var(--borderRadiusMedium);
}

/* Caption 1 Strong — Fluent labels small text rather than tracking it out. */
.eyebrow {
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  font-weight: var(--fontWeightSemibold);
  color: var(--colorNeutralForeground3);
}

.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* --------------------------------------------------------------- masthead */
.masthead {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--colorNeutralBackground1);
  border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
}

.masthead-inner {
  max-width: 1580px;
  margin: 0 auto;
  padding: var(--spacingM) var(--spacingXXL);
  display: flex;
  align-items: center;
  gap: var(--spacingXL);
  flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: var(--spacingM); margin-right: auto; }
.brand-icon { height: 36px; width: auto; display: block; }

.brand-text h1 {
  font-size: var(--fontSizeBase500);
  line-height: var(--lineHeightBase500);
}
.brand-text p {
  margin: 0;
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  color: var(--colorNeutralForeground3);
}

/* Fluent Input: a hairline box with a stronger bottom stroke that turns
   brand and thickens on focus. */
.search { position: relative; flex: 1 1 280px; max-width: 420px; }

.search input {
  width: 100%;
  height: 32px;
  padding: 0 32px 0 32px;
  background: var(--colorNeutralBackground1);
  border: var(--strokeWidthThin) solid var(--colorNeutralStroke1);
  border-bottom-color: var(--colorNeutralStrokeAccessible);
  border-radius: var(--borderRadiusMedium);
  font-size: var(--fontSizeBase300);
  color: var(--colorNeutralForeground1);
}
.search input::placeholder { color: var(--colorNeutralForeground4); }
.search input:hover { border-color: var(--colorNeutralStroke1Hover); border-bottom-color: var(--colorNeutralStrokeAccessible); }
.search input:focus {
  outline: none;
  border-color: var(--colorNeutralStroke1);
  box-shadow: inset 0 -2px 0 0 var(--colorCompoundBrandStroke);
  border-bottom-color: var(--colorCompoundBrandStroke);
}
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--colorNeutralForeground3); pointer-events: none; }

.search .clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px;
  border: 0; background: none; color: var(--colorNeutralForeground3);
  cursor: pointer; border-radius: var(--borderRadiusMedium); line-height: 1;
}
.search .clear:hover { background: var(--colorSubtleBackgroundHover); color: var(--colorNeutralForeground1); }

.tools { display: flex; gap: var(--spacingS); align-items: center; }

/* Fluent Button, secondary appearance. */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacingS);
  height: 32px;
  padding: 0 var(--spacingM);
  background: var(--colorNeutralBackground1);
  border: var(--strokeWidthThin) solid var(--colorNeutralStroke1);
  border-radius: var(--borderRadiusMedium);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  font-weight: var(--fontWeightSemibold);
  color: var(--colorNeutralForeground1);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--durationFaster) var(--curveEasyEase);
}
.btn:hover { background: var(--colorNeutralBackground1Hover); border-color: var(--colorNeutralStroke1Hover); }
.btn:active { background: var(--colorNeutralBackground1Pressed); }

/* Fluent Button, subtle appearance. */
.btn-ghost {
  background: none;
  border-color: transparent;
  color: var(--colorNeutralForeground2);
  width: 32px;
  padding: 0;
}
.btn-ghost:hover { background: var(--colorSubtleBackgroundHover); border-color: transparent; color: var(--colorNeutralForeground1); }

/* ------------------------------------------------------------------ shell */
.shell {
  max-width: 1580px;
  margin: 0 auto;
  padding: var(--spacingXL) var(--spacingXXL) 64px;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  gap: var(--spacingXXL);
  align-items: start;
}

/* ------------------------------------------------------------------- rail */
.rail {
  position: sticky;
  top: 84px;
  max-height: calc(100vh - 108px);
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  padding-right: var(--spacingXS);
}

.rail-head {
  display: flex;
  align-items: center;
  gap: var(--spacingS);
  padding-bottom: var(--spacingS);
}
.rail-head .eyebrow { margin-right: auto; }

.rail-close {
  display: none;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  flex: none;
  border: 0;
  border-radius: var(--borderRadiusMedium);
  background: none;
  color: var(--colorNeutralForeground2);
  font-size: var(--fontSizeBase400);
  line-height: 1;
  cursor: pointer;
}
.rail-close:hover { background: var(--colorSubtleBackgroundHover); color: var(--colorNeutralForeground1); }

/* Fluent Accordion: a chevron that rotates, headers in Body 1 Strong. */
.facet { border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke3); padding: var(--spacingXS) 0; }
.facet:first-of-type { border-top: 0; }

.facet > summary {
  display: flex;
  align-items: center;
  gap: var(--spacingS);
  cursor: pointer;
  list-style: none;
  padding: var(--spacingS) var(--spacingXS);
  border-radius: var(--borderRadiusMedium);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  font-weight: var(--fontWeightSemibold);
  color: var(--colorNeutralForeground1);
}
.facet > summary::-webkit-details-marker { display: none; }
.facet > summary::before {
  content: "";
  width: 6px; height: 6px;
  border-right: var(--strokeWidthThin) solid var(--colorNeutralForeground3);
  border-bottom: var(--strokeWidthThin) solid var(--colorNeutralForeground3);
  transform: rotate(-45deg);
  transition: transform var(--durationFast) var(--curveEasyEase);
  margin-left: var(--spacingXXS);
}
.facet[open] > summary::before { transform: rotate(45deg); }
.facet > summary:hover { background: var(--colorSubtleBackgroundHover); }

.facet .count-on {
  margin-left: auto;
  font-size: var(--fontSizeBase200);
  font-weight: var(--fontWeightSemibold);
  color: var(--colorBrandForeground1);
}

.opts { display: flex; flex-direction: column; padding-bottom: var(--spacingXS); }

/* Fluent Checkbox row. */
.opt {
  display: flex;
  align-items: center;
  gap: var(--spacingS);
  min-height: 32px;
  padding: 0 var(--spacingS) 0 var(--spacingXS);
  border-radius: var(--borderRadiusMedium);
  cursor: pointer;
  font-size: var(--fontSizeBase300);
  color: var(--colorNeutralForeground1);
}
.opt:hover { background: var(--colorSubtleBackgroundHover); }
.opt input {
  appearance: none;
  width: 16px; height: 16px;
  margin: 0;
  flex: none;
  border: var(--strokeWidthThin) solid var(--colorNeutralStrokeAccessible);
  border-radius: var(--borderRadiusSmall);
  background: var(--colorNeutralBackground1);
  cursor: pointer;
  position: relative;
}
.opt input:checked {
  background: var(--colorBrandBackground);
  border-color: var(--colorBrandBackground);
}
.opt input:checked::after {
  content: "";
  position: absolute;
  left: 4px; top: 1px;
  width: 4px; height: 8px;
  border: solid var(--colorNeutralForegroundOnBrand);
  border-width: 0 var(--strokeWidthThick) var(--strokeWidthThick) 0;
  transform: rotate(45deg);
}
.opt .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .n {
  font-size: var(--fontSizeBase200);
  color: var(--colorNeutralForeground3);
  font-variant-numeric: tabular-nums;
}
.opt.is-on { font-weight: var(--fontWeightSemibold); }
.opt.is-empty { color: var(--colorNeutralForegroundDisabled); }
.opt.is-empty .n { color: var(--colorNeutralForegroundDisabled); }

.swatch { width: 8px; height: 8px; border-radius: var(--borderRadiusSmall); flex: none; }
.sw-live { background: var(--live-fg); }
.sw-ticketing { background: var(--ticketing-fg); }
.sw-built { background: var(--built-fg); }
.sw-new { background: var(--new-fg); }
.sw-later { background: var(--later-fg); }

/* ------------------------------------------------------------------- main */
.main { display: flex; flex-direction: column; gap: var(--spacingL); min-width: 0; }

/* Fluent Card, filled appearance: background 1 lifted by shadow 4. */
.stats {
  display: flex;
  flex-wrap: wrap;
  background: var(--colorNeutralBackground1);
  border-radius: var(--borderRadiusMedium);
  overflow: hidden;
  box-shadow: var(--shadow4);
}

.stat {
  flex: 1 1 132px;
  background: var(--colorNeutralBackground1);
  box-shadow: -1px 0 0 var(--colorNeutralStroke3), 0 -1px 0 var(--colorNeutralStroke3);
  padding: var(--spacingM) var(--spacingL) var(--spacingL);
  display: flex;
  flex-direction: column;
  gap: var(--spacingXXS);
  text-align: left;
  border: 0;
  font: inherit;
}
button.stat { cursor: pointer; }
button.stat:hover { background: var(--colorSubtleBackgroundHover); }

.stat .v {
  font-family: var(--fontFamilyDisplay);
  font-size: var(--fontSizeHero700);
  line-height: var(--lineHeightHero700);
  font-weight: var(--fontWeightSemibold);
  font-variant-numeric: tabular-nums;
  color: var(--colorNeutralForeground1);
}
.stat .k {
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  color: var(--colorNeutralForeground2);
}
.stat .sub {
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  color: var(--colorNeutralForeground3);
}
.sub-ticketing { color: var(--ticketing-fg); }
.stat.accent .v { color: var(--colorBrandForeground1); }
.stat.good .v { color: var(--live-fg); }

/* ------------------------------------------------------------ month strip */
.months {
  background: var(--colorNeutralBackground1);
  border-radius: var(--borderRadiusMedium);
  padding: var(--spacingM) var(--spacingL) var(--spacingS);
  box-shadow: var(--shadow4);
}
.months-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--spacingMNudge); margin-bottom: var(--spacingM); }
.bars { display: flex; gap: var(--spacingL); align-items: flex-end; overflow-x: auto; padding-bottom: var(--spacingXXS); }

/* fit-content, not 0: the groups must refuse to compress so .bars scrolls
   instead. Shrinking let each band's bars overflow its own box and collide
   with the next band's at the period boundaries. */
.rp-group { display: flex; flex-direction: column; gap: var(--spacingS); min-width: fit-content; }
.rp-bars { display: flex; gap: var(--spacingXS); align-items: flex-end; }

/* Reads as a Fluent tab: a quiet label that gains a brand rule when chosen. */
.rp-label {
  border: 0;
  border-top: var(--strokeWidthThick) solid var(--colorNeutralStroke2);
  background: none;
  padding: var(--spacingSNudge) 0 0;
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  font-weight: var(--fontWeightSemibold);
  color: var(--colorNeutralForeground3);
  cursor: pointer;
  text-align: center;
  transition: color var(--durationFaster) var(--curveEasyEase);
}
.rp-label:hover { color: var(--colorNeutralForeground1); border-top-color: var(--colorNeutralStroke1); }
.rp-label.is-on { color: var(--colorBrandForeground1); border-top-color: var(--colorCompoundBrandStroke); }

.bar {
  flex: 1 1 0;
  min-width: 34px;
  border: 0;
  background: none;
  padding: 0 0 var(--spacingXS);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: var(--spacingXS);
  border-radius: var(--borderRadiusMedium);
}
.bar .col {
  height: 56px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: var(--colorNeutralBackground4);
  border-radius: var(--borderRadiusSmall);
  overflow: hidden;
}
.bar .fill {
  background: var(--colorBrandBackground);
  border-radius: var(--borderRadiusSmall) var(--borderRadiusSmall) 0 0;
  transition: height var(--durationNormal) var(--curveEasyEase);
}
.bar .m {
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  color: var(--colorNeutralForeground3);
  text-align: center;
}
.bar .c {
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  color: var(--colorNeutralForeground2);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.bar:hover .fill { background: var(--colorBrandBackgroundHover); }
.bar.is-on .fill { background: var(--colorBrandBackgroundPressed); }
.bar.is-on .m, .bar.is-on .c { color: var(--colorBrandForeground1); font-weight: var(--fontWeightSemibold); }
.bar.is-zero { opacity: .4; }

/* ---------------------------------------------------------------- toolbar */
.toolbar { display: flex; align-items: center; gap: var(--spacingM); flex-wrap: wrap; }
.result-count { font-size: var(--fontSizeBase300); color: var(--colorNeutralForeground3); margin-right: auto; }
.result-count strong { color: var(--colorNeutralForeground1); font-weight: var(--fontWeightSemibold); font-variant-numeric: tabular-nums; }

/* Fluent TabList: selection is a brand rule under the label, not a pill. */
.segmented { display: inline-flex; gap: var(--spacingXS); }
.segmented button {
  position: relative;
  border: 0;
  background: none;
  padding: var(--spacingS) var(--spacingMNudge);
  border-radius: var(--borderRadiusMedium);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  font-weight: var(--fontWeightRegular);
  color: var(--colorNeutralForeground2);
  cursor: pointer;
}
.segmented button:hover { background: var(--colorSubtleBackgroundHover); color: var(--colorNeutralForeground1); }
.segmented button::after {
  content: "";
  position: absolute;
  left: var(--spacingMNudge); right: var(--spacingMNudge); bottom: 2px;
  height: var(--strokeWidthThick);
  border-radius: var(--borderRadiusCircular);
  background: transparent;
  transition: background var(--durationFaster) var(--curveEasyEase);
}
.segmented button[aria-pressed="true"] { color: var(--colorNeutralForeground1); font-weight: var(--fontWeightSemibold); }
.segmented button[aria-pressed="true"]::after { background: var(--colorCompoundBrandStroke); }

/* Fluent Tag: a dismissible filter token. */
.chips { display: flex; flex-wrap: wrap; gap: var(--spacingS); align-items: center; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--spacingSNudge);
  height: 24px;
  padding: 0 var(--spacingS);
  background: var(--colorNeutralBackground3);
  color: var(--colorNeutralForeground1);
  border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
  border-radius: var(--borderRadiusMedium);
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  cursor: pointer;
}
.chip:hover { background: var(--colorNeutralBackground1Hover); border-color: var(--colorNeutralStroke1); }
.chip .x { font-size: var(--fontSizeBase300); line-height: 1; color: var(--colorNeutralForeground3); }

/* ----------------------------------------------------------- schedule view */
.month-group { margin-bottom: var(--spacingXXL); }

.month-rule {
  display: flex;
  align-items: baseline;
  gap: var(--spacingM);
  padding-bottom: var(--spacingS);
  margin-bottom: var(--spacingM);
  border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
}
.month-rule h2 {
  font-size: var(--fontSizeBase400);
  line-height: var(--lineHeightBase400);
}
.month-rule .n {
  font-size: var(--fontSizeBase200);
  color: var(--colorNeutralForeground3);
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

.rows { display: flex; flex-direction: column; gap: var(--spacingS); }

/* Fluent Card at rest on shadow 2, lifting to shadow 8 on hover. The status
   stripe is kept: it is the fastest read of where a row sits in the pipeline. */
.row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  gap: var(--spacingL);
  align-items: start;
  width: 100%;
  text-align: left;
  background: var(--colorNeutralBackground1);
  border: 0;
  border-left: var(--strokeWidthThicker, 3px) solid var(--colorNeutralStroke1);
  border-radius: var(--borderRadiusMedium);
  padding: var(--spacingM) var(--spacingL);
  cursor: pointer;
  font: inherit;
  color: inherit;
  box-shadow: var(--shadow2);
  transition: box-shadow var(--durationFast) var(--curveEasyEase), background var(--durationFaster) var(--curveEasyEase);
}
.row:hover { background: var(--colorNeutralBackground1Hover); box-shadow: var(--shadow8); }
.row.st-live { border-left-color: var(--live-fg); }
.row.st-ticketing { border-left-color: var(--ticketing-fg); }
.row.st-built { border-left-color: var(--built-fg); }
.row.st-new { border-left-color: var(--new-fg); }
.row.st-later { border-left-color: var(--later-fg); }

.date-cell { text-align: center; padding-top: var(--spacingXXS); }
.date-cell .d {
  font-family: var(--fontFamilyDisplay);
  font-size: var(--fontSizeBase600);
  line-height: var(--lineHeightBase600);
  font-weight: var(--fontWeightSemibold);
  font-variant-numeric: tabular-nums;
  color: var(--colorNeutralForeground1);
}
.date-cell .w {
  font-size: var(--fontSizeBase100);
  line-height: var(--lineHeightBase100);
  text-transform: uppercase;
  color: var(--colorNeutralForeground3);
  margin-top: var(--spacingXXS);
}

.row-body { min-width: 0; display: flex; flex-direction: column; gap: var(--spacingXS); }
.row-title {
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  font-weight: var(--fontWeightSemibold);
  color: var(--colorNeutralForeground1);
}
.row-meta {
  display: flex; flex-wrap: wrap; gap: var(--spacingXXS) var(--spacingM);
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  color: var(--colorNeutralForeground3);
}
.row-meta span { display: inline-flex; align-items: center; gap: var(--spacingXS); }
.row-tags { display: flex; flex-wrap: wrap; gap: var(--spacingXS); margin-top: var(--spacingXXS); }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: var(--spacingXS); }

/* Fluent Badge, medium: 20px tall, pill shaped, Caption 1 Strong. */
.pill {
  display: inline-block;
  max-width: 100%;
  height: 20px;
  padding: 0 var(--spacingS);
  border-radius: var(--borderRadiusCircular);
  font-size: var(--fontSizeBase200);
  /* 18px + the 1px borders = the 20px badge height */
  line-height: 18px;
  font-weight: var(--fontWeightSemibold);
  /* A long category name truncates rather than spilling past the card edge. */
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: top;
  border: var(--strokeWidthThin) solid transparent;
}
/* tint appearance */
.pill-live { background: var(--live-bg); color: var(--live-fg); border-color: var(--live-stroke); }
.pill-ticketing { background: var(--ticketing-bg); color: var(--ticketing-fg); border-color: var(--ticketing-stroke); }
.pill-built { background: var(--built-bg); color: var(--built-fg); border-color: var(--built-stroke); }
.pill-new { background: var(--new-bg); color: var(--new-fg); border-color: var(--new-stroke); }
.pill-later { background: var(--later-bg); color: var(--later-fg); border-color: var(--later-stroke); }
.pill-cpd { background: var(--cpd-bg); color: var(--cpd-fg); border-color: var(--cpd-stroke); }
/* ghost and outline appearances */
.pill-type { background: var(--colorNeutralBackground3); color: var(--colorNeutralForeground2); }
.pill-cat { background: transparent; color: var(--colorNeutralForeground3); border-color: var(--colorNeutralStroke2); font-weight: var(--fontWeightRegular); }
.pill-local { background: transparent; color: var(--colorBrandForeground1); border-color: var(--colorBrandStroke1); }
.pill-ext { background: transparent; color: var(--colorNeutralForeground2); border-color: var(--colorNeutralStrokeAccessible); }

.tickets { font-size: var(--fontSizeBase200); color: var(--colorNeutralForeground3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tickets b { color: var(--colorNeutralForeground2); font-weight: var(--fontWeightSemibold); }

/* -------------------------------------------------------------- table view */
.table-wrap {
  overflow-x: auto;
  background: var(--colorNeutralBackground1);
  border-radius: var(--borderRadiusMedium);
  box-shadow: var(--shadow4);
}
table { border-collapse: collapse; width: 100%; font-size: var(--fontSizeBase300); }

/* top: 0 — .table-wrap sets overflow-x, which forces overflow-y to compute to
   auto, so the wrapper is this header's scroll container. Any offset here
   pushes the header down from the table's top edge and through the first row. */
thead th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--colorNeutralBackground1);
  text-align: left;
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  font-weight: var(--fontWeightSemibold);
  color: var(--colorNeutralForeground2);
  padding: var(--spacingMNudge) var(--spacingM);
  border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
  white-space: nowrap;
}
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { background: var(--colorSubtleBackgroundHover); color: var(--colorNeutralForeground1); }
thead th .arrow { color: var(--colorNeutralForeground4); font-size: 9px; }
tbody td { padding: var(--spacingMNudge) var(--spacingM); border-bottom: var(--strokeWidthThin) solid var(--colorNeutralStroke3); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--colorSubtleBackgroundHover); }
tbody tr:last-child td { border-bottom: 0; }
td.t-name { font-weight: var(--fontWeightSemibold); min-width: 250px; }
td.t-date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--colorNeutralForeground2); }
td.t-num { text-align: right; font-variant-numeric: tabular-nums; }
td.t-dim { color: var(--colorNeutralForeground3); }

/* ------------------------------------------------------------------ empty */
.empty {
  background: var(--colorNeutralBackground1);
  border-radius: var(--borderRadiusMedium);
  box-shadow: var(--shadow2);
  padding: 48px var(--spacingXXL);
  text-align: center;
  color: var(--colorNeutralForeground3);
}
.empty h3 {
  font-size: var(--fontSizeBase400);
  line-height: var(--lineHeightBase400);
  color: var(--colorNeutralForeground1);
  margin-bottom: var(--spacingS);
}

/* ------------------------------------------------- overlay drawer (Fluent) */
.scrim {
  position: fixed;
  inset: 0;
  background: var(--colorBackgroundOverlay);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--durationNormal) var(--curveEasyEase);
}
.scrim.is-open { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(460px, 100%);
  z-index: 61;
  background: var(--colorNeutralBackground1);
  box-shadow: var(--shadow64);
  transform: translateX(100%);
  transition: transform var(--durationGentle) var(--curveDecelerateMid);
  display: flex;
  flex-direction: column;
}
.panel.is-open { transform: none; }

.panel-head {
  padding: var(--spacingL) var(--spacingXL) var(--spacingM);
  display: flex;
  gap: var(--spacingM);
  align-items: flex-start;
}
.panel-head h2 {
  font-size: var(--fontSizeBase500);
  line-height: var(--lineHeightBase500);
  flex: 1;
}
.panel-close {
  display: inline-flex; align-items: center; justify-content: center;
  border: 0;
  background: none;
  border-radius: var(--borderRadiusMedium);
  width: 32px; height: 32px;
  cursor: pointer;
  color: var(--colorNeutralForeground2);
  font-size: var(--fontSizeBase400);
  line-height: 1;
  flex: none;
}
.panel-close:hover { background: var(--colorSubtleBackgroundHover); color: var(--colorNeutralForeground1); }

.panel-body { overflow-y: auto; padding: 0 var(--spacingXL) var(--spacingXXXL); display: flex; flex-direction: column; gap: var(--spacingL); }
.panel-pills { display: flex; flex-wrap: wrap; gap: var(--spacingXS); }
.panel-summary { font-size: var(--fontSizeBase300); line-height: var(--lineHeightBase400); color: var(--colorNeutralForeground2); }

.dl { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: var(--spacingS) var(--spacingM); font-size: var(--fontSizeBase300); }
.dl dt { color: var(--colorNeutralForeground3); font-size: var(--fontSizeBase200); line-height: var(--lineHeightBase300); }
.dl dd { margin: 0; color: var(--colorNeutralForeground1); }
.dl dd.mono { font-family: var(--fontFamilyMonospace); font-size: var(--fontSizeBase200); word-break: break-word; color: var(--colorNeutralForeground2); }

.panel-block { border-top: var(--strokeWidthThin) solid var(--colorNeutralStroke3); padding-top: var(--spacingL); }
.panel-block > .eyebrow { display: block; margin-bottom: var(--spacingS); }

.note {
  background: var(--colorNeutralBackground3);
  border: var(--strokeWidthThin) solid var(--colorNeutralStroke3);
  border-radius: var(--borderRadiusMedium);
  padding: var(--spacingMNudge) var(--spacingM);
  font-size: var(--fontSizeBase300);
  line-height: var(--lineHeightBase300);
  color: var(--colorNeutralForeground2);
}

/* Fluent Button, primary appearance. */
.panel-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--spacingS);
  height: 32px;
  padding: 0 var(--spacingM);
  background: var(--colorBrandBackground);
  color: var(--colorNeutralForegroundOnBrand);
  border-radius: var(--borderRadiusMedium);
  text-decoration: none;
  font-weight: var(--fontWeightSemibold);
  font-size: var(--fontSizeBase300);
}
.panel-link:hover { background: var(--colorBrandBackgroundHover); color: var(--colorNeutralForegroundOnBrand); }
.panel-link:active { background: var(--colorBrandBackgroundPressed); }

.siblings { display: flex; flex-direction: column; gap: var(--spacingXS); }
.sibling {
  display: flex;
  align-items: baseline;
  gap: var(--spacingMNudge);
  padding: var(--spacingS) var(--spacingMNudge);
  background: var(--colorNeutralBackground1);
  border: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
  border-radius: var(--borderRadiusMedium);
  font-size: var(--fontSizeBase300);
  cursor: pointer;
  text-align: left;
  width: 100%;
  color: inherit;
}
.sibling:hover { background: var(--colorSubtleBackgroundHover); border-color: var(--colorNeutralStroke1); }
.sibling .s-n { font-family: var(--fontFamilyMonospace); font-size: var(--fontSizeBase200); color: var(--colorNeutralForeground3); flex: none; }
.sibling .s-d { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--colorNeutralForeground3); font-size: var(--fontSizeBase200); flex: none; }
.sibling.is-current { border-color: var(--colorBrandStroke1); background: var(--colorBrandBackground2); }

/* ----------------------------------------------------------------- footer */
.foot {
  max-width: 1580px;
  margin: 0 auto;
  padding: 0 var(--spacingXXL) var(--spacingXXXL);
  font-size: var(--fontSizeBase200);
  line-height: var(--lineHeightBase200);
  color: var(--colorNeutralForeground3);
  display: flex;
  gap: var(--spacingS) var(--spacingXL);
  flex-wrap: wrap;
  align-items: center;
}

.foot .by { display: inline-flex; align-items: center; gap: var(--spacingS); }

/* The mark is drawn as a background so the artwork is embedded once in the
   stylesheet and shared by the header and the footer, rather than carried
   twice as inline data URIs. */
.cc-link { display: inline-flex; align-items: center; border-radius: var(--borderRadiusSmall); }

.cc {
  display: block;
  height: 22px;
  aspect-ratio: 61 / 22;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}

.cc-light { background-image: url("__CC_COLOUR__"); }
.cc-dark { background-image: url("__CC_WHITE__"); }

/* One artwork per theme. Light is the default, so the white mark stays hidden
   until a dark theme resolves, in either of the two ways it can. */
.cc-dark { display: none; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .cc-light { display: none; }
  :root:not([data-theme="light"]) .cc-dark { display: block; }
}

:root[data-theme="dark"] .cc-light { display: none; }
:root[data-theme="dark"] .cc-dark { display: block; }

/* Separates the agency credit from the dashboard's own controls. */
.cc-head {
  margin-left: var(--spacingXS);
  padding-left: var(--spacingM);
  border-left: var(--strokeWidthThin) solid var(--colorNeutralStroke2);
}

.rail-toggle { display: none; }

/* ------------------------------------------------------------ responsive */
@media (max-width: 1080px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail-toggle { display: inline-flex; }
  .rail-close { display: inline-flex; }

  /* A drawer, not an inline block. Inline, the rail opened below every result
     row - roughly 21,000px down on a phone - so the button looked dead. It is
     also taller than a phone screen, so it needs to scroll independently. */
  .rail {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(330px, 88vw);
    z-index: 62;
    max-height: none;
    overflow-y: auto;
    background: var(--colorNeutralBackground1);
    border-radius: 0;
    box-shadow: var(--shadow64);
    padding: var(--spacingL) var(--spacingL) var(--spacingXXXL);
  }
  .rail[hidden] { display: none; }
}

@media (max-width: 700px) {
  .masthead-inner { padding: var(--spacingM) var(--spacingL); gap: var(--spacingM); }
  .brand-icon { height: 30px; }
  .brand-text p { display: none; }
  .cc-head { display: none; }
  .shell { padding: var(--spacingL) var(--spacingL) 48px; gap: var(--spacingL); }
  .foot { padding: 0 var(--spacingL) var(--spacingXXL); }
  .row { grid-template-columns: 44px minmax(0, 1fr); gap: var(--spacingM); }
  .row-side { grid-column: 2; flex-direction: row; align-items: center; flex-wrap: wrap; }
  .date-cell .d { font-size: var(--fontSizeBase500); line-height: var(--lineHeightBase500); }
  .stat .v { font-size: var(--fontSizeBase600); line-height: var(--lineHeightBase600); }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

@media print {
  .masthead, .rail, .months, .toolbar, .scrim, .panel, .foot, .tools { display: none !important; }
  .shell { display: block; padding: 0; }
  .row { break-inside: avoid; box-shadow: none; border: 1px solid var(--colorNeutralStroke2); }
  body { background: #fff; }
}
</style>
</head>

<body>
<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <img class="brand-icon" src="__SPH_ICON__" alt="Bristol &amp; Beyond Stronger Practice Hub">
      <div class="brand-text">
        <h1>SPH Activity Dashboard</h1>
        <p>Powered by Chaos Canvas by Chaos Created</p>
      </div>
    </div>

    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <label class="sr" for="q">Search activities</label>
      <input id="q" type="search" placeholder="Search titles, notes, venues&hellip;" autocomplete="off">
      <button class="clear" id="qClear" type="button" hidden aria-label="Clear search">&times;</button>
    </div>

    <div class="tools">
      <button class="btn rail-toggle" id="railToggle" type="button" aria-expanded="false" aria-controls="rail">Filters</button>
      <button class="btn btn-ghost" id="themeBtn" type="button" aria-label="Switch theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
      <a class="cc-link cc-head" href="https://chaoscreated.com/" target="_blank" rel="noopener" aria-label="Chaos Created">
        <span class="cc cc-light" aria-hidden="true"></span>
        <span class="cc cc-dark" aria-hidden="true"></span>
      </a>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="rail" id="rail" aria-label="Filters" tabindex="-1">
    <div class="rail-head">
      <span class="eyebrow">Filters</span>
      <button class="btn btn-ghost" id="resetBtn" type="button" style="padding:2px 6px;font-size:12px">Reset all</button>
      <button class="rail-close" id="railClose" type="button" aria-label="Close filters">&times;</button>
    </div>
    <div id="facets"></div>
  </aside>

  <main class="main">
    <section class="stats" id="stats" aria-label="Summary"></section>

    <section class="months">
      <div class="months-head">
        <span class="eyebrow">Activities by month</span>
        <span class="eyebrow" id="monthHint">Click a month or period to filter</span>
      </div>
      <div class="bars" id="bars"></div>
    </section>

    <div class="toolbar">
      <p class="result-count" id="count"></p>
      <div class="chips" id="chips"></div>
      <div class="segmented" role="group" aria-label="View">
        <button type="button" data-view="schedule" aria-pressed="true">Schedule</button>
        <button type="button" data-view="table" aria-pressed="false">Table</button>
      </div>
    </div>

    <div id="results"></div>
  </main>
</div>

<footer class="foot">
  <span>Data updated <span id="genDate"></span></span>
  <span>&copy; <span id="year"></span> Bristol &amp; Beyond Stronger Practice Hub</span>
  <span class="by">Dashboard by
    <a class="cc-link" href="https://chaoscreated.com/" target="_blank" rel="noopener" aria-label="Chaos Created">
      <span class="cc cc-light" aria-hidden="true"></span>
      <span class="cc cc-dark" aria-hidden="true"></span>
    </a>
  </span>
</footer>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1">
  <div class="panel-head">
    <h2 id="panelTitle"></h2>
    <button class="panel-close" id="panelClose" type="button" aria-label="Close">&times;</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<script>
const DATA = "__SPH_DATA__";
const ACTIVITIES = DATA.activities;

/* ------------------------------------------------------------------ utils */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const MONTH_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const STATUS_ORDER = ["live", "ticketing", "built", "new", "later"];
const STATUS_TEXT = {
  live: "Live on website",
  ticketing: "Needs ticketing",
  built: "Built, not public",
  new: "Not yet on website",
  later: "Later session",
  unknown: "Status not set",
};

// Only http(s) links are rendered. Every URL in the workbook is https today,
// but the column is free text, and a "javascript:" value typed into it would
// otherwise become a link that runs when a colleague clicks it.
function safeUrl(url) {
  const trimmed = String(url == null ? "" : url).trim();
  return /^https?:\/\//i.test(trimmed) ? trimmed : "";
}

function ukDate(iso) {
  if (!iso) return "TBC";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function longDate(iso, day) {
  if (!iso) return "Date TBC";
  const [y, m, d] = iso.split("-");
  return `${day ? day + " " : ""}${Number(d)} ${MONTH_SHORT[Number(m) - 1]} ${y}`;
}

/* ---------------------------------------------------------------- facets */
const FACETS = [
  { id: "rp", label: "Reporting period", get: (a) => [a.rp], order: ["RP1", "RP2", "RP3", "RP4"] },
  { id: "type", label: "Activity type", get: (a) => (a.type ? [a.type] : []) },
  { id: "format", label: "Format", get: (a) => [a.format] },
  { id: "scope", label: "Regional or local", get: (a) => (a.scope ? [a.scope] : []), order: ["Regional", "Local"] },
  { id: "registration", label: "Registration", get: (a) => (a.registration ? [a.registration] : []) },
  { id: "status", label: "Website status", get: (a) => [a.status], order: STATUS_ORDER, render: (v) => STATUS_TEXT[v] || v, swatch: true },
  { id: "pd", label: "PD category", get: (a) => (a.pd ? [a.pd] : []) },
  { id: "brochure", label: "Brochure category", get: (a) => (a.brochure ? [a.brochure] : []) },
  { id: "network", label: "Network", get: (a) => (a.network ? [a.network] : []) },
  { id: "venue", label: "Venue", get: (a) => (a.venue ? [a.venue] : []) },
  { id: "mailing", label: "Mailing list", get: (a) => a.mailing || [] },
  // A blank cell means nobody has said either way, so it stays out of the
  // counts rather than being reported as unprocessed.
  { id: "processed", label: "Processed for reports", order: ["Processed", "Not processed"],
    get: (a) => (a.processed == null ? [] : [a.processed ? "Processed" : "Not processed"]) },
  { id: "flags", label: "Needs attention", custom: true },
];

const FLAGS = {
  ticketing: { label: "Needs ticketing", test: (a) => a.status === "ticketing" },
  nourl:     { label: "No website link", test: (a) => !safeUrl(a.url) },
  tbc:       { label: "Venue or time to confirm", test: (a) => a.format === "Venue TBC" || a.time === "TO ADD" },
};

const state = {
  q: "",
  view: "schedule",
  sort: "date",
  dir: 1,
  sel: {},
  months: new Set(),
  hideLater: false,
};
FACETS.forEach((f) => (state.sel[f.id] = new Set()));

function matchesText(a) {
  if (!state.q) return true;
  const hay = [a.name, a.summary, a.notes, a.location, a.venue, a.brochure, a.pd,
               a.network, a.type, (a.mailing || []).join(" "), a.day, a.time,
               a.scope, a.registration]
    .join(" ").toLowerCase();
  return state.q.split(/\s+/).every((t) => hay.includes(t));
}

function passesFlags(a, except) {
  for (const [key, flag] of Object.entries(FLAGS)) {
    if (key === except) continue;
    if (state.sel.flags.has(key) && !flag.test(a)) return false;
  }
  return true;
}

/** Filter, optionally ignoring one facet (so its own option counts stay live). */
function filtered(ignore) {
  return ACTIVITIES.filter((a) => {
    if (state.hideLater && a.session && a.session > 1) return false;
    if (!matchesText(a)) return false;
    if (ignore !== "months" && state.months.size && !state.months.has(a.month)) return false;
    for (const facet of FACETS) {
      if (facet.id === ignore) continue;
      if (facet.custom) { if (!passesFlags(a)) return false; continue; }
      const chosen = state.sel[facet.id];
      if (!chosen.size) continue;
      if (!facet.get(a).some((v) => chosen.has(v))) return false;
    }
    if (ignore && ignore !== "flags" && ignore !== "months") {
      if (!passesFlags(a)) return false;
    }
    return true;
  });
}

/* ------------------------------------------------------------ rail render */
function renderFacets() {
  const html = FACETS.map((facet) => {
    const chosen = state.sel[facet.id];
    const pool = filtered(facet.id);
    let options;

    if (facet.custom) {
      options = Object.entries(FLAGS).map(([key, flag]) => ({
        value: key,
        label: flag.label,
        n: filtered("flags").filter((a) => passesFlags(a, key) && flag.test(a)).length,
      }));
    } else {
      const counts = new Map();
      pool.forEach((a) => facet.get(a).forEach((v) => counts.set(v, (counts.get(v) || 0) + 1)));
      // Keep chosen values visible even when the current filters zero them out.
      chosen.forEach((v) => { if (!counts.has(v)) counts.set(v, 0); });
      options = [...counts.keys()].sort((a, b) => {
        if (facet.order) return facet.order.indexOf(a) - facet.order.indexOf(b);
        return a.localeCompare(b);
      }).map((v) => ({ value: v, label: facet.render ? facet.render(v) : v, n: counts.get(v), swatch: facet.swatch }));
    }

    if (!options.length) return "";
    const open = chosen.size > 0 || ["rp", "type", "status"].includes(facet.id);

    return `<details class="facet" ${open ? "open" : ""} data-facet="${facet.id}">
      <summary>${esc(facet.label)}${chosen.size ? `<span class="count-on">${chosen.size}</span>` : ""}</summary>
      <div class="opts">${options.map((o) => `
        <label class="opt ${chosen.has(o.value) ? "is-on" : ""} ${o.n === 0 ? "is-empty" : ""}">
          <input type="checkbox" data-facet="${facet.id}" value="${esc(o.value)}" ${chosen.has(o.value) ? "checked" : ""}>
          ${o.swatch ? `<span class="swatch sw-${esc(o.value)}"></span>` : ""}
          <span class="label" title="${esc(o.label)}">${esc(o.label)}</span>
          <span class="n num">${o.n}</span>
        </label>`).join("")}</div>
    </details>`;
  }).join("");

  $("#facets").innerHTML = html + `
    <div class="facet" style="padding-top:14px">
      <label class="opt ${state.hideLater ? "is-on" : ""}">
        <input type="checkbox" id="hideLater" ${state.hideLater ? "checked" : ""}>
        <span class="label">Count programmes once</span>
      </label>
      <p style="margin:4px 0 0 6px;font-size:11.5px;color:var(--muted);line-height:1.4">
        Hides sessions 2 and 3 of multi-part CPD programmes &mdash; one booking covers them all.
      </p>
    </div>`;
}

/* ----------------------------------------------------------------- stats */
function renderStats(rows) {
  const distinct = rows.filter((a) => a.counts).length;
  const online = rows.filter((a) => a.format === "Online").length;
  const f2f = rows.filter((a) => a.format === "Face-to-face").length;
  const capacity = rows.reduce((sum, a) => sum + (a.tickets || 0), 0);
  const counted = rows.filter((a) => a.tickets != null).length;
  const elsewhere = rows.filter((a) => a.tickets == null && a.ticketsText).length;
  const live = rows.filter((a) => a.status === "live" || a.status === "ticketing").length;
  const ticketing = rows.filter((a) => a.status === "ticketing").length;
  // Anything not published and not a later session still needs a page. Later
  // sessions are covered by session 1's booking and never get one of their own,
  // so counting them here would overstate the backlog.
  const pending = rows.filter((a) => !["live", "ticketing", "later"].includes(a.status)).length;

  const card = (cls, value, key, sub, action) => `
    <${action ? "button" : "div"} class="stat ${cls}" ${action ? `type="button" data-stat="${action}"` : ""}>
      <span class="v num">${value}</span>
      <span class="k">${key}</span>
      ${sub ? `<span class="sub">${sub}</span>` : ""}
    </${action ? "button" : "div"}>`;

  $("#stats").innerHTML = [
    card("accent", distinct, "Activities", `${rows.length} individual sessions`),
    card("", online, "Online", `${Math.round(online / (rows.length || 1) * 100)}% of sessions`, "online"),
    card("", f2f, "Face-to-face", f2f ? `${new Set(rows.filter((a) => a.venue).map((a) => a.venue)).size} venues` : "&mdash;", "f2f"),
    card("", capacity.toLocaleString("en-GB"), "Ticket capacity",
      `across ${counted} of ${rows.length} sessions`
      + (elsewhere ? `<br>${elsewhere} booked externally` : "")),
    card("good", live, "Live on website",
      `${pending} still to publish`
      + (ticketing ? `<br><span class="sub-ticketing">${ticketing} live, not yet ticketed</span>` : ""),
      "live"),
  ].join("");
}

/* ------------------------------------------------------------ month strip */
// Which reporting period each month sits in, taken from the data rather than
// hard-coded, so it stays right if the periods ever move.
const MONTH_PERIOD = new Map();
ACTIVITIES.forEach((a) => {
  if (a.month && a.rp && !MONTH_PERIOD.has(a.month)) MONTH_PERIOD.set(a.month, a.rp);
});
const PERIOD_RANGE = new Map((DATA.periods || []).map((p) => [p.id, p.from + " to " + p.to]));

function renderMonths(rows) {
  const all = new Map();
  ACTIVITIES.forEach((a) => { if (a.month) all.set(a.month, (all.get(a.month) || 0) + 1); });
  const hits = new Map();
  rows.forEach((a) => { if (a.month) hits.set(a.month, (hits.get(a.month) || 0) + 1); });
  const keys = [...all.keys()].sort();
  const peak = Math.max(...all.values(), 1);

  const bar = (key) => {
    const [y, m] = key.split("-");
    const total = all.get(key) || 0;
    const hit = hits.get(key) || 0;
    const on = state.months.has(key);
    return `<button type="button" class="bar ${on ? "is-on" : ""} ${hit === 0 ? "is-zero" : ""}"
        data-month="${key}" aria-pressed="${on}"
        title="${MONTH_SHORT[Number(m) - 1]} ${y}: ${hit} of ${total} shown">
      <span class="c num">${hit}</span>
      <span class="col"><span class="fill" style="height:${Math.max(hit / peak * 100, hit ? 6 : 0)}%"></span></span>
      <span class="m">${MONTH_SHORT[Number(m) - 1]}</span>
    </button>`;
  };

  // Consecutive months in the same period form one band.
  const bands = [];
  keys.forEach((key) => {
    const rp = MONTH_PERIOD.get(key) || "";
    const last = bands[bands.length - 1];
    if (last && last.rp === rp) last.keys.push(key);
    else bands.push({ rp, keys: [key] });
  });

  $("#bars").innerHTML = bands.map((band) => {
    const on = state.sel.rp.has(band.rp);
    const range = PERIOD_RANGE.get(band.rp);
    // Grow by month count so bars stay the same width across bands.
    return `<div class="rp-group" style="flex:${band.keys.length} 1 0">
      <div class="rp-bars">${band.keys.map(bar).join("")}</div>
      ${band.rp ? `<button type="button" class="rp-label ${on ? "is-on" : ""}" data-rp="${esc(band.rp)}"
          aria-pressed="${on}" title="${esc(band.rp)}${range ? ", " + esc(range) : ""}">${esc(band.rp)}</button>` : ""}
    </div>`;
  }).join("");
}

/* ---------------------------------------------------------------- results */
function sorted(rows) {
  const copy = rows.slice();
  const key = state.sort;
  copy.sort((a, b) => {
    let x, y;
    if (key === "tickets") { x = a.tickets || 0; y = b.tickets || 0; }
    else if (key === "date") { x = (a.date || "9999") + String(a.timeSort).padStart(4, "0"); y = (b.date || "9999") + String(b.timeSort).padStart(4, "0"); }
    else { x = String(a[key] || "").toLowerCase(); y = String(b[key] || "").toLowerCase(); }
    if (x < y) return -1 * state.dir;
    if (x > y) return 1 * state.dir;
    return a.name.localeCompare(b.name);
  });
  return copy;
}

function rowCard(a) {
  const [, , d] = (a.date || "--,--,--").split("-");
  const cat = a.network ? `${a.network} Network` : a.brochure;
  return `<button type="button" class="row st-${a.status}" data-id="${a.id}">
    <span class="date-cell">
      <span class="d num">${a.date ? Number(d) : "&mdash;"}</span>
      <span class="w">${esc((a.day || "TBC").slice(0, 3))}</span>
    </span>
    <span class="row-body">
      <span class="row-title">${esc(a.name)}</span>
      <span class="row-meta">
        <span>${esc(a.time || "Time TBC")}</span>
        <span>${a.format === "Online" ? "Online" : esc(a.venue || a.location || "Venue TBC")}</span>
        ${a.tickets ? `<span class="num">${a.tickets} tickets</span>` : ""}
      </span>
      <span class="row-tags">
        <span class="pill pill-type">${esc(a.type || "Activity")}</span>
        ${cat ? `<span class="pill pill-cat">${esc(cat)}</span>` : ""}
        ${a.cpd === "Yes" ? `<span class="pill pill-cpd">CPD bundle</span>` : ""}
        ${a.scope === "Local" ? `<span class="pill pill-local">Local</span>` : ""}
        ${a.registration && a.registration !== "Website" ? `<span class="pill pill-ext">${esc(a.registration)}</span>` : ""}
      </span>
    </span>
    <span class="row-side">
      <span class="pill pill-${a.status}">${esc(STATUS_TEXT[a.status] || a.status)}</span>
      ${a.session ? `<span class="tickets">Session <b>${a.session} of ${a.parts}</b></span>` : ""}
    </span>
  </button>`;
}

const COLUMNS = [
  { key: "date", label: "Date", cls: "t-date", cell: (a) => ukDate(a.date) },
  { key: "day", label: "Day", cls: "t-dim", cell: (a) => a.day },
  { key: "time", label: "Time", cls: "t-dim", cell: (a) => a.time },
  { key: "name", label: "Activity", cls: "t-name", cell: (a) => esc(a.name) },
  { key: "type", label: "Type", cls: "", cell: (a) => a.type },
  { key: "format", label: "Location", cls: "t-dim", cell: (a) => a.format === "Online" ? "Online" : (a.location || "TBC") },
  { key: "tickets", label: "Tickets", cls: "t-num",
    cell: (a) => (a.tickets != null ? a.tickets : (a.ticketsText || "")) },
  { key: "brochure", label: "Brochure category", cls: "t-dim", cell: (a) => a.brochure },
  { key: "pd", label: "PD category", cls: "t-dim", cell: (a) => a.pd },
  { key: "status", label: "Status", cls: "", cell: (a) => `<span class="pill pill-${a.status}">${esc(STATUS_TEXT[a.status] || a.status)}</span>` },
  { key: "workflows", label: "Workflows", cls: "t-dim", cell: (a) => a.workflows || "&mdash;" },
  { key: "scope", label: "Regional/local", cls: "t-dim", cell: (a) => a.scope },
  { key: "registration", label: "Registration", cls: "t-dim", cell: (a) => a.registration },
  { key: "processed", label: "Reports", cls: "t-dim",
    cell: (a) => (a.processed == null ? "" : (a.processed ? "Processed" : "Not processed")) },
];

function renderResults(rows) {
  const target = $("#results");
  if (!rows.length) {
    target.innerHTML = `<div class="empty">
      <h3>Nothing matches those filters</h3>
      <p>Try clearing a filter or widening your search.</p>
    </div>`;
    return;
  }

  if (state.view === "table") {
    const head = COLUMNS.map((c) => {
      const on = state.sort === c.key;
      return `<th class="sortable ${c.cls}" data-sort="${c.key}" aria-sort="${on ? (state.dir === 1 ? "ascending" : "descending") : "none"}">
        ${esc(c.label)} <span class="arrow">${on ? (state.dir === 1 ? "▲" : "▼") : "△"}</span></th>`;
    }).join("");
    const body = sorted(rows).map((a) => `<tr data-id="${a.id}">${
      COLUMNS.map((c) => `<td class="${c.cls}">${c.cell(a) == null || c.cell(a) === "" ? "&mdash;" : (c.key === "name" || c.key === "status" ? c.cell(a) : esc(c.cell(a)))}</td>`).join("")
    }</tr>`).join("");
    target.innerHTML = `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    return;
  }

  const groups = new Map();
  sorted(rows).forEach((a) => {
    const key = a.month || "tbc";
    if (!groups.has(key)) groups.set(key, { label: a.monthLabel, items: [] });
    groups.get(key).items.push(a);
  });

  target.innerHTML = [...groups.entries()].map(([key, group]) => `
    <section class="month-group">
      <div class="month-rule">
        <h2>${esc(group.label)}</h2>
        <span class="n">${group.items.length} ${group.items.length === 1 ? "activity" : "activities"}</span>
      </div>
      <div class="rows">${group.items.map(rowCard).join("")}</div>
    </section>`).join("");
}

/* ----------------------------------------------------------------- chips */
function renderChips() {
  const chips = [];
  FACETS.forEach((facet) => {
    state.sel[facet.id].forEach((value) => {
      // A hand-edited or truncated shared link can carry a value we do not
      // know; show it verbatim rather than throwing and blanking the page.
      const flag = facet.custom ? FLAGS[value] : null;
      const label = facet.custom
        ? (flag ? flag.label : value)
        : (facet.render ? facet.render(value) : value);
      chips.push(`<button class="chip" type="button" data-drop="${facet.id}" data-value="${esc(value)}">${esc(label)}<span class="x">&times;</span></button>`);
    });
  });
  state.months.forEach((m) => {
    const [y, mm] = m.split("-");
    chips.push(`<button class="chip" type="button" data-drop="months" data-value="${m}">${MONTH_SHORT[Number(mm) - 1]} ${y}<span class="x">&times;</span></button>`);
  });
  $("#chips").innerHTML = chips.join("");
}

/* ---------------------------------------------------------------- render */
function render() {
  const rows = filtered();
  renderFacets();
  renderStats(rows);
  renderMonths(rows);
  renderChips();
  renderResults(rows);

  const total = ACTIVITIES.length;
  const distinct = rows.filter((a) => a.counts).length;
  $("#count").innerHTML = rows.length === total
    ? `<strong>${total}</strong> sessions &middot; <strong>${distinct}</strong> distinct activities`
    : `<strong>${rows.length}</strong> of ${total} sessions &middot; <strong>${distinct}</strong> distinct activities`;
  $("#qClear").hidden = !state.q;
  writeHash();
}

/* --------------------------------------------------------------- details */
let lastFocus = null;

function openPanel(id) {
  const a = ACTIVITIES.find((x) => x.id === id);
  if (!a) return;
  lastFocus = document.activeElement;

  const siblings = a.parts > 0 ? ACTIVITIES.filter((x) => x.key === a.key).sort((x, y) => (x.session || 0) - (y.session || 0)) : [];
  const rowsHtml = (pairs) => `<dl class="dl">${pairs.filter((p) => p[1]).map(
    ([k, v, cls]) => `<dt>${esc(k)}</dt><dd class="${cls || ""}">${cls === "mono" ? esc(v) : v}</dd>`).join("")}</dl>`;

  $("#panelTitle").textContent = a.name;
  $("#panelBody").innerHTML = `
    <div class="panel-pills">
      <span class="pill pill-${a.status}">${esc(STATUS_TEXT[a.status] || a.status)}</span>
      <span class="pill pill-type">${esc(a.type || "Activity")}</span>
      <span class="pill pill-cat">${esc(a.rp)}</span>
      ${a.cpd === "Yes" ? `<span class="pill pill-cpd">CPD bundle</span>` : ""}
    </div>

    ${a.summary ? `<p class="panel-summary">${esc(a.summary)}</p>` : ""}

    ${rowsHtml([
      ["When", `${esc(longDate(a.date, a.day))}${a.time ? `<br>${esc(a.time)}` : ""}`],
      ["Where", a.format === "Online" ? "Online" : esc(a.location || "Venue TBC")],
      ["Reach", esc(a.scope)],
      ["Registration", esc(a.registration)],
      ["Tickets", a.tickets != null
        ? `<span class="num">${a.tickets}</span>`
        : (a.ticketsText ? esc(a.ticketsText) : "")],
      ["Brochure", esc(a.brochure)],
      ["PD category", esc(a.pd)],
      ["Network", esc(a.network)],
      ["Mailing list", esc((a.mailing || []).join(" &middot; ")).replace(/&amp;middot;/g, "&middot;")],
      ["CPD bundle", esc(a.cpd)],
      ["Workflows", a.workflows === "Yes" ? "Configured" : `<span style="color:var(--rust);font-weight:600">Not configured</span>`],
      ["Reports", a.processed == null ? "" : (a.processed ? "Processed" : "Not processed")],
    ])}

    ${a.notes ? `<div class="panel-block"><span class="eyebrow">Notes</span><p class="note">${esc(a.notes)}</p></div>` : ""}

    ${siblings.length > 1 ? `<div class="panel-block">
      <span class="eyebrow">Programme sessions</span>
      <div class="siblings">${siblings.map((s) => `
        <button type="button" class="sibling ${s.id === a.id ? "is-current" : ""}" data-id="${s.id}">
          <span class="s-n">${s.session ? "S" + s.session : "—"}</span>
          <span>${esc(s.stem === s.name ? s.name : "Session " + (s.session || "?"))}</span>
          <span class="s-d num">${esc(ukDate(s.date))}</span>
        </button>`).join("")}</div>
    </div>` : ""}

    <div class="panel-block">
      <span class="eyebrow">HubSpot list tags</span>
      ${rowsHtml([
        ["Registered", a.tags.registered, "mono"],
        ["Attended", a.tags.attended, "mono"],
        ["Activity type", a.tags.type, "mono"],
        ["PD category", a.tags.pd, "mono"],
        ["Network", a.tags.network, "mono"],
      ])}
    </div>

    ${safeUrl(a.url) ? `<div class="panel-block"><a class="panel-link" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">
      View course page
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path d="M7 17L17 7M9 7h8v8"></path></svg>
    </a></div>` : `<div class="panel-block"><p style="color:var(--muted);font-size:13.5px;margin:0">No website page linked yet.</p></div>`}`;

  $("#panel").classList.add("is-open");
  $("#panel").focus();
  updateScrim();
}

function closePanel() {
  if (!$("#panel").classList.contains("is-open")) return;
  $("#panel").classList.remove("is-open");
  updateScrim();
  if (lastFocus) lastFocus.focus();
}

/* ------------------------------------------------------------ filter drawer */
// Below this width the rail is a drawer over the page; above it, a fixed
// column that is always on screen.
const narrow = matchMedia("(max-width: 1080px)");

function railOpen() {
  return narrow.matches && !$("#rail").hasAttribute("hidden");
}

function updateScrim() {
  const open = railOpen() || $("#panel").classList.contains("is-open");
  $("#scrim").classList.toggle("is-open", open);
}

function setRail(open, moveFocus) {
  const rail = $("#rail");
  open ? rail.removeAttribute("hidden") : rail.setAttribute("hidden", "");
  $("#railToggle").setAttribute("aria-expanded", String(open));
  updateScrim();
  // Focus follows the drawer only when someone opens or closes it. On a desktop
  // load the rail is just part of the page, and focusing it there paints a
  // focus ring around the whole column before anyone has touched anything.
  if (!moveFocus || !narrow.matches) return;
  open ? rail.focus() : $("#railToggle").focus();
}

// Crossing the breakpoint resets the rail to that layout's default, so a rail
// hidden on a phone can never stay hidden on a desktop, where nothing reopens it.
function applyLayout() {
  setRail(!narrow.matches);
}

/* -------------------------------------------------------- shareable state */
function writeHash() {
  const parts = [];
  if (state.q) parts.push("q=" + encodeURIComponent(state.q));
  FACETS.forEach((f) => { if (state.sel[f.id].size) parts.push(f.id + "=" + [...state.sel[f.id]].map(encodeURIComponent).join("|")); });
  if (state.months.size) parts.push("months=" + [...state.months].join("|"));
  if (state.hideLater) parts.push("once=1");
  if (state.view !== "schedule") parts.push("view=" + state.view);
  const hash = parts.join("&");
  try {
    history.replaceState(null, "", hash ? "#" + hash : location.pathname + location.search);
  } catch (err) {
    // Sandboxed or opaque origin: shareable links are unavailable, filters still work.
  }
}

function readHash() {
  const hash = location.hash.replace(/^#/, "");
  if (!hash) return;
  hash.split("&").forEach((pair) => {
    const [key, raw = ""] = pair.split("=");
    const value = decodeURIComponent(raw);
    if (key === "q") state.q = value.toLowerCase();
    else if (key === "months") value.split("|").forEach((v) => state.months.add(v));
    else if (key === "once") state.hideLater = value === "1";
    else if (key === "view") state.view = value === "table" ? "table" : "schedule";
    else if (key === "flags") value.split("|").forEach((v) => {
      if (Object.prototype.hasOwnProperty.call(FLAGS, v)) state.sel.flags.add(v);
    });
    else if (state.sel[key]) value.split("|").forEach((v) => state.sel[key].add(decodeURIComponent(v)));
  });
  $("#q").value = state.q;
  document.querySelectorAll(".segmented button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
}

/* -------------------------------------------------------------- listeners */
$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("#qClear").addEventListener("click", () => { state.q = ""; $("#q").value = ""; $("#q").focus(); render(); });

$("#facets").addEventListener("change", (e) => {
  const input = e.target;
  if (input.id === "hideLater") { state.hideLater = input.checked; render(); return; }
  const facet = input.dataset.facet;
  if (!facet) return;
  const set = state.sel[facet];
  input.checked ? set.add(input.value) : set.delete(input.value);
  render();
});

$("#bars").addEventListener("click", (e) => {
  const band = e.target.closest(".rp-label");
  if (band) { toggle("rp", band.dataset.rp); render(); return; }
  const bar = e.target.closest(".bar");
  if (!bar) return;
  state.months.has(bar.dataset.month) ? state.months.delete(bar.dataset.month) : state.months.add(bar.dataset.month);
  render();
});

$("#chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  if (chip.dataset.drop === "months") state.months.delete(chip.dataset.value);
  else state.sel[chip.dataset.drop].delete(chip.dataset.value);
  render();
});

$("#stats").addEventListener("click", (e) => {
  const stat = e.target.closest("[data-stat]");
  if (!stat) return;
  const map = {
    online: () => toggle("format", "Online"),
    f2f: () => toggle("format", "Face-to-face"),
    // The tile counts both published states, so clicking it selects both.
    live: () => {
      const both = ["live", "ticketing"];
      const on = both.every((v) => state.sel.status.has(v));
      both.forEach((v) => (on ? state.sel.status.delete(v) : state.sel.status.add(v)));
    },
  };
  map[stat.dataset.stat]?.();
  render();
});

function toggle(facet, value) {
  const set = state.sel[facet];
  set.has(value) ? set.delete(value) : set.add(value);
}

$("#results").addEventListener("click", (e) => {
  const hit = e.target.closest("[data-id]");
  if (hit) openPanel(hit.dataset.id);
});

$("#results").addEventListener("click", (e) => {
  const th = e.target.closest("th[data-sort]");
  if (!th) return;
  const key = th.dataset.sort;
  if (state.sort === key) state.dir *= -1;
  else { state.sort = key; state.dir = 1; }
  render();
}, true);

document.querySelectorAll(".segmented button").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.view = btn.dataset.view;
    state.sort = state.view === "table" ? state.sort : "date";
    document.querySelectorAll(".segmented button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b === btn)));
    render();
  });
});

$("#panelBody").addEventListener("click", (e) => {
  const sib = e.target.closest(".sibling");
  if (sib) openPanel(sib.dataset.id);
});

$("#panelClose").addEventListener("click", closePanel);
$("#scrim").addEventListener("click", () => { closePanel(); if (railOpen()) setRail(false, true); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closePanel(); if (railOpen()) setRail(false, true); }
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});

$("#resetBtn").addEventListener("click", () => {
  state.q = "";
  $("#q").value = "";
  state.months.clear();
  state.hideLater = false;
  FACETS.forEach((f) => state.sel[f.id].clear());
  render();
});

$("#railToggle").addEventListener("click", () => setRail(!railOpen(), true));
$("#railClose").addEventListener("click", () => setRail(false, true));
narrow.addEventListener("change", applyLayout);

$("#themeBtn").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const dark = current
    ? current === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("sph-theme", next); } catch (err) { /* storage blocked */ }
});

/* ------------------------------------------------------------------- boot */
try {
  const saved = localStorage.getItem("sph-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (err) { /* storage blocked */ }

applyLayout();

$("#genDate").textContent = DATA.generated;
$("#year").textContent = DATA.year;
readHash();
render();
</script>
</body>
</html>
