:root {
  color-scheme: light;

  /* -- colour roles, light ---------------------------------------------- */
  --md-primary: #005caa;
  --md-on-primary: #eef3ff;
  --md-primary-container: #5aa2ff;
  --md-on-primary-container: #002347;
  --md-secondary: #2457b7;
  --md-secondary-container: #c1d1ff;
  --md-on-secondary-container: #00429f;
  --md-tertiary-container: #fbdfff;
  --md-on-tertiary-container: #6a2785;
  --md-error: #ba1a1a;

  --md-surface: #f6f6ff;
  --md-on-surface: #1e2e51;
  --md-surface-variant: #d1dcff;
  --md-on-surface-variant: #4c5b81;
  --md-surface-container-lowest: #ffffff;
  --md-surface-container-low: #eef0ff;
  --md-surface-container: #e2e7ff;
  --md-surface-container-high: #dae2ff;
  --md-surface-container-highest: #d1dcff;
  --md-outline: #67769e;
  --md-outline-variant: #9eacd7;
  --md-inverse-surface: #000c2b;
  --md-inverse-on-surface: #8d9cc6;
  --md-scrim: #000000;

  /* Two tones of the one brand role, so selection reads without a second hue. */
  --md-chart-bar: #5aa2ff;
  --md-chart-bar-selected: #005caa;
  --md-chart-track: #dae2ff;

  /* -- status: one M3 container pair per spreadsheet fill colour --------- */
  --live-c: #bcf1a9;      --live-on: #23501b;
  --built-c: #8ff2f6;     --built-on: #004f52;
  --ticketing-c: #e6deff; --ticketing-on: #493d7d;
  --new-c: #ffdea0;       --new-on: #5c4300;
  --later-c: #ffdbcb;     --later-on: #793000;
  --cpd-c: #ffd9df;       --cpd-on: #7e2742;

  /* -- type scale -------------------------------------------------------- */
  --md-font: Roboto, "Segoe UI", system-ui, -apple-system, sans-serif;
  --md-font-mono: "Roboto Mono", "Cascadia Mono", Consolas, monospace;

  /* -- shape scale ------------------------------------------------------- */
  --md-shape-xs: 4px;
  --md-shape-s: 8px;
  --md-shape-m: 12px;
  --md-shape-l: 16px;
  --md-shape-xl: 28px;
  --md-shape-full: 9999px;

  /* -- elevation --------------------------------------------------------- */
  --md-elevation-1: 0 1px 2px rgba(0, 0, 0, .30), 0 1px 3px 1px rgba(0, 0, 0, .15);
  --md-elevation-2: 0 1px 2px rgba(0, 0, 0, .30), 0 2px 6px 2px rgba(0, 0, 0, .15);
  --md-elevation-3: 0 1px 3px rgba(0, 0, 0, .30), 0 4px 8px 3px rgba(0, 0, 0, .15);
  --md-elevation-5: 0 4px 4px rgba(0, 0, 0, .30), 0 8px 12px 6px rgba(0, 0, 0, .15);

  /* -- state layers ------------------------------------------------------ */
  --md-state-hover: .08;
  --md-state-pressed: .10;

  /* -- motion ------------------------------------------------------------ */
  --md-easing-standard: cubic-bezier(.2, 0, 0, 1);
  --md-easing-decelerate: cubic-bezier(.05, .7, .1, 1);
  --md-duration-short: 200ms;
  --md-duration-medium: 300ms;
  --md-duration-long: 400ms;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --md-primary: #77b0ff;
    --md-on-primary: #002f5b;
    --md-primary-container: #5aa2ff;
    --md-on-primary-container: #002347;
    --md-secondary: #709bff;
    --md-secondary-container: #0346a6;
    --md-on-secondary-container: #cad7ff;
    --md-tertiary-container: #5e1978;
    --md-on-tertiary-container: #f9d8ff;
    --md-error: #ffb4ab;

    --md-surface: #000c2b;
    --md-on-surface: #dee5ff;
    --md-surface-variant: #072355;
    --md-on-surface-variant: #9baad5;
    --md-surface-container-lowest: #000000;
    --md-surface-container-low: #001135;
    --md-surface-container: #001742;
    --md-surface-container-high: #031d4b;
    --md-surface-container-highest: #072355;
    --md-outline: #66759c;
    --md-outline-variant: #38476c;
    --md-inverse-surface: #faf8ff;
    --md-inverse-on-surface: #46547a;

    --md-chart-bar: #5aa2ff;
    --md-chart-bar-selected: #77b0ff;
    --md-chart-track: #072355;

    --live-c: #23501b;      --live-on: #bcf1a9;
    --built-c: #004f52;     --built-on: #8ff2f6;
    --ticketing-c: #493d7d; --ticketing-on: #e6deff;
    --new-c: #5c4300;       --new-on: #ffdea0;
    --later-c: #793000;     --later-on: #ffdbcb;
    --cpd-c: #7e2742;       --cpd-on: #ffd9df;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --md-primary: #77b0ff;
  --md-on-primary: #002f5b;
  --md-primary-container: #5aa2ff;
  --md-on-primary-container: #002347;
  --md-secondary: #709bff;
  --md-secondary-container: #0346a6;
  --md-on-secondary-container: #cad7ff;
  --md-tertiary-container: #5e1978;
  --md-on-tertiary-container: #f9d8ff;
  --md-error: #ffb4ab;

  --md-surface: #000c2b;
  --md-on-surface: #dee5ff;
  --md-surface-variant: #072355;
  --md-on-surface-variant: #9baad5;
  --md-surface-container-lowest: #000000;
  --md-surface-container-low: #001135;
  --md-surface-container: #001742;
  --md-surface-container-high: #031d4b;
  --md-surface-container-highest: #072355;
  --md-outline: #66759c;
  --md-outline-variant: #38476c;
  --md-inverse-surface: #faf8ff;
  --md-inverse-on-surface: #46547a;

  --md-chart-bar: #5aa2ff;
  --md-chart-bar-selected: #77b0ff;
  --md-chart-track: #072355;

  --live-c: #23501b;      --live-on: #bcf1a9;
  --built-c: #004f52;     --built-on: #8ff2f6;
  --ticketing-c: #493d7d; --ticketing-on: #e6deff;
  --new-c: #5c4300;       --new-on: #ffdea0;
  --later-c: #793000;     --later-on: #ffdbcb;
  --cpd-c: #7e2742;       --cpd-on: #ffd9df;
}

/* ------------------------------------------------------------------ base */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--md-surface);
  color: var(--md-on-surface);
  font-family: var(--md-font);
  /* body-medium */
  font-size: 14px;
  line-height: 20px;
  letter-spacing: .25px;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; font-weight: 400; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--md-primary); }

:focus-visible {
  outline: 3px solid var(--md-primary);
  outline-offset: 2px;
  border-radius: var(--md-shape-xs);
}

/* label-medium */
.eyebrow {
  font-size: 12px;
  line-height: 16px;
  font-weight: 500;
  letter-spacing: .5px;
  color: var(--md-on-surface-variant);
}

.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* --------------------------------------------------- top app bar (M3) */
.masthead {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--md-surface);
  transition: background var(--md-duration-short) var(--md-easing-standard);
}

.masthead-inner {
  max-width: 1580px;
  margin: 0 auto;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 16px; margin-right: auto; }
.brand-icon { height: 40px; width: auto; display: block; }

/* title-large */
.brand-text h1 { font-size: 22px; line-height: 28px; letter-spacing: 0; }
/* body-small */
.brand-text p { margin: 0; font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--md-on-surface-variant); }

/* M3 search bar: a full-round filled field, no outline. */
.search { position: relative; flex: 1 1 300px; max-width: 440px; }

.search input {
  width: 100%;
  height: 48px;
  padding: 0 44px 0 48px;
  background: var(--md-surface-container-high);
  border: 0;
  border-radius: var(--md-shape-full);
  font-size: 16px;
  line-height: 24px;
  letter-spacing: .5px;
  color: var(--md-on-surface);
}
.search input::placeholder { color: var(--md-on-surface-variant); }
.search input:focus { outline: 3px solid var(--md-primary); outline-offset: 0; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--md-on-surface-variant); pointer-events: none; }

.search .clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  border: 0; background: none; color: var(--md-on-surface-variant);
  cursor: pointer; border-radius: var(--md-shape-full); line-height: 1;
}
.search .clear:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }

.tools { display: flex; gap: 8px; align-items: center; }

/* M3 outlined button: 40px tall, fully rounded, label-large. */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  padding: 0 24px;
  background: transparent;
  border: 1px solid var(--md-outline);
  border-radius: var(--md-shape-full);
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  letter-spacing: .1px;
  color: var(--md-primary);
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--md-duration-short) var(--md-easing-standard);
}
.btn:hover { background: color-mix(in srgb, var(--md-primary) 8%, transparent); }
.btn:active { background: color-mix(in srgb, var(--md-primary) 10%, transparent); }

/* M3 icon button. */
.btn-ghost {
  border-color: transparent;
  color: var(--md-on-surface-variant);
  width: 40px;
  padding: 0;
}
.btn-ghost:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); border-color: transparent; }

/* ------------------------------------------------------------------ shell */
.shell {
  max-width: 1580px;
  margin: 0 auto;
  padding: 16px 24px 64px;
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 24px;
  align-items: start;
}

/* ------------------------------------------------------------------- rail */
.rail {
  position: sticky;
  top: 88px;
  max-height: calc(100vh - 112px);
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  padding-right: 4px;
}

.rail-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px 8px;
}
.rail-head .eyebrow { margin-right: auto; }

.rail-close {
  display: none;
  align-items: center;
  justify-content: center;
  width: 40px; height: 40px;
  flex: none;
  border: 0;
  border-radius: var(--md-shape-full);
  background: none;
  color: var(--md-on-surface-variant);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}
.rail-close:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }

/* Expansion rows behave like M3 list items: 48px tall with a state layer. */
.facet { padding: 2px 0; }
.facet:first-of-type { border-top: 0; }

.facet > summary {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  list-style: none;
  min-height: 48px;
  padding: 0 12px;
  border-radius: var(--md-shape-full);
  /* body-large */
  font-size: 16px;
  line-height: 24px;
  letter-spacing: .5px;
  color: var(--md-on-surface);
}
.facet > summary::-webkit-details-marker { display: none; }
.facet > summary::before {
  content: "";
  width: 7px; height: 7px;
  border-right: 2px solid var(--md-on-surface-variant);
  border-bottom: 2px solid var(--md-on-surface-variant);
  transform: rotate(-45deg);
  transition: transform var(--md-duration-short) var(--md-easing-standard);
  margin-left: 4px;
  flex: none;
}
.facet[open] > summary::before { transform: rotate(45deg); }
.facet > summary:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }

.facet .count-on {
  margin-left: auto;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .5px;
  color: var(--md-primary);
}

.opts { display: flex; flex-direction: column; padding-bottom: 4px; }

/* M3 checkbox in a list row. */
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 40px;
  padding: 0 12px;
  border-radius: var(--md-shape-full);
  cursor: pointer;
  font-size: 14px;
  line-height: 20px;
  letter-spacing: .25px;
  color: var(--md-on-surface);
}
.opt:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
.opt input {
  appearance: none;
  width: 18px; height: 18px;
  margin: 0;
  flex: none;
  border: 2px solid var(--md-on-surface-variant);
  border-radius: 2px;
  background: transparent;
  cursor: pointer;
  position: relative;
  transition: background var(--md-duration-short) var(--md-easing-standard);
}
.opt input:checked { background: var(--md-primary); border-color: var(--md-primary); }
.opt input:checked::after {
  content: "";
  position: absolute;
  left: 4px; top: 0;
  width: 5px; height: 10px;
  border: solid var(--md-on-primary);
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.opt .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .n { font-size: 12px; letter-spacing: .5px; color: var(--md-on-surface-variant); font-variant-numeric: tabular-nums; }
.opt.is-on { font-weight: 500; }
.opt.is-empty { opacity: .38; }

.swatch { width: 10px; height: 10px; border-radius: var(--md-shape-full); flex: none; }
.sw-live { background: var(--live-on); }
.sw-ticketing { background: var(--ticketing-on); }
.sw-built { background: var(--built-on); }
.sw-new { background: var(--new-on); }
.sw-later { background: var(--later-on); }

/* ------------------------------------------------------------------- main */
.main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* Separate M3 filled cards on a grid. auto-fill, not auto-fit: a lone card on
   a wrapped row keeps its track width instead of stretching across the page. */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}

.stat {
  background: var(--tile-bg, var(--md-surface-container-low));
  color: var(--tile-fg, var(--md-on-surface));
  border-radius: var(--md-shape-m);
  padding: 16px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  text-align: left;
  border: 0;
  font: inherit;
  transition: background var(--md-duration-short) var(--md-easing-standard);
}
button.stat { cursor: pointer; }
button.stat:hover {
  background: color-mix(in srgb, var(--tile-fg, var(--md-on-surface)) 8%, var(--tile-bg, var(--md-surface-container-low)));
}

/* One tonal container per measure. This is where an M3 dashboard gets its
   colour: the roles exist to be used, not just to tint a grey page. */
.stat.tone-primary { --tile-bg: var(--md-primary-container); --tile-fg: var(--md-on-primary-container); }
.stat.tone-secondary { --tile-bg: var(--md-secondary-container); --tile-fg: var(--md-on-secondary-container); }
.stat.tone-tertiary { --tile-bg: var(--md-tertiary-container); --tile-fg: var(--md-on-tertiary-container); }
.stat.tone-live { --tile-bg: var(--live-c); --tile-fg: var(--live-on); }

/* headline-medium — M3 sets large numerals in regular weight. */
.stat .v {
  font-size: 28px;
  line-height: 36px;
  font-weight: 400;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
  color: inherit;
}
.stat .k { font-size: 14px; line-height: 20px; letter-spacing: .25px; color: inherit; }
.stat .sub { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--tile-fg, var(--md-on-surface-variant)); }
/* On a plain tile this line keeps the ticketing purple; on a tonal one it
   takes the tile's own colour rather than fighting it. */
.sub-ticketing { color: var(--tile-fg, var(--ticketing-on)); font-weight: 500; }

/* ------------------------------------------------------------ month strip */
.months {
  background: var(--md-surface-container-low);
  border-radius: var(--md-shape-m);
  padding: 16px 20px 12px;
}
.months-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.bars { display: flex; gap: 16px; align-items: flex-end; overflow-x: auto; padding-bottom: 2px; }

/* fit-content, not 0: the groups must refuse to compress so .bars scrolls
   instead. Shrinking let each band's bars overflow its own box and collide
   with the next band's at the period boundaries. */
.rp-group { display: flex; flex-direction: column; gap: 8px; min-width: fit-content; }
.rp-bars { display: flex; gap: 4px; align-items: flex-end; }

/* Reads as an M3 tab: a 3px indicator with rounded ends when selected. */
.rp-label {
  border: 0;
  border-top: 3px solid var(--md-outline-variant);
  border-radius: 3px 3px 0 0;
  background: none;
  padding: 8px 0 0;
  font-size: 12px;
  line-height: 16px;
  font-weight: 500;
  letter-spacing: .5px;
  color: var(--md-on-surface-variant);
  cursor: pointer;
  text-align: center;
  transition: color var(--md-duration-short) var(--md-easing-standard);
}
.rp-label:hover { color: var(--md-on-surface); }
.rp-label.is-on { color: var(--md-primary); border-top-color: var(--md-primary); }

.bar {
  flex: 1 1 0;
  min-width: 34px;
  border: 0;
  background: none;
  padding: 0 0 4px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 4px;
  border-radius: var(--md-shape-xs);
}
.bar .col {
  height: 56px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background: var(--md-chart-track);
  border-radius: var(--md-shape-xs);
  overflow: hidden;
}
.bar .fill {
  background: var(--md-chart-bar);
  border-radius: var(--md-shape-xs) var(--md-shape-xs) 0 0;
  transition: height var(--md-duration-medium) var(--md-easing-standard);
}
.bar .m { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: .5px; color: var(--md-on-surface-variant); text-align: center; }
.bar .c { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: .5px; color: var(--md-on-surface); text-align: center; font-variant-numeric: tabular-nums; }
.bar:hover .fill { background: var(--md-chart-bar-selected); }
.bar.is-on .fill { background: var(--md-chart-bar-selected); }
.bar.is-on .m, .bar.is-on .c { color: var(--md-primary); }
.bar.is-zero { opacity: .38; }

/* ---------------------------------------------------------------- toolbar */
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.result-count { font-size: 14px; line-height: 20px; letter-spacing: .25px; color: var(--md-on-surface-variant); margin-right: auto; }
.result-count strong { color: var(--md-on-surface); font-weight: 500; font-variant-numeric: tabular-nums; }

/* M3 primary tabs: a 3px indicator with rounded top corners. */
.segmented { display: inline-flex; gap: 4px; }
.segmented button {
  position: relative;
  border: 0;
  background: none;
  padding: 12px 16px;
  border-radius: var(--md-shape-s) var(--md-shape-s) 0 0;
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  letter-spacing: .1px;
  color: var(--md-on-surface-variant);
  cursor: pointer;
  transition: color var(--md-duration-short) var(--md-easing-standard);
}
.segmented button:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
.segmented button::after {
  content: "";
  position: absolute;
  left: 8px; right: 8px; bottom: 0;
  height: 3px;
  border-radius: 3px 3px 0 0;
  background: transparent;
  transition: background var(--md-duration-short) var(--md-easing-standard);
}
.segmented button[aria-pressed="true"] { color: var(--md-primary); }
.segmented button[aria-pressed="true"]::after { background: var(--md-primary); }

/* M3 filter chip, selected state. */
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px;
  background: var(--md-secondary-container);
  color: var(--md-on-secondary-container);
  border: 0;
  border-radius: var(--md-shape-s);
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  letter-spacing: .1px;
  cursor: pointer;
}
.chip:hover { background: color-mix(in srgb, var(--md-on-secondary-container) 8%, var(--md-secondary-container)); }
.chip .x { font-size: 18px; line-height: 1; }

/* ----------------------------------------------------------- schedule view */
.month-group { margin-bottom: 24px; }

.month-rule {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding-bottom: 8px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--md-outline-variant);
}
/* title-medium */
.month-rule h2 { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .15px; }
.month-rule .n { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--md-on-surface-variant); margin-left: auto; font-variant-numeric: tabular-nums; }

.rows { display: flex; flex-direction: column; gap: 8px; }

/* M3 filled card, 12px corners, rising to elevation 1 on hover. The status
   stripe is kept: it is the fastest read of where a row sits in the pipeline. */
.row {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr) auto;
  gap: 16px;
  align-items: start;
  width: 100%;
  text-align: left;
  background: var(--md-surface-container-low);
  border: 0;
  border-left: 4px solid var(--md-outline);
  border-radius: var(--md-shape-m);
  padding: 16px;
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: box-shadow var(--md-duration-short) var(--md-easing-standard),
              background var(--md-duration-short) var(--md-easing-standard);
}
.row:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, var(--md-surface-container-low)); box-shadow: var(--md-elevation-1); }
.row.st-live { border-left-color: var(--live-on); }
.row.st-ticketing { border-left-color: var(--ticketing-on); }
.row.st-built { border-left-color: var(--built-on); }
.row.st-new { border-left-color: var(--new-on); }
.row.st-later { border-left-color: var(--later-on); }

.date-cell { text-align: center; padding-top: 2px; }
/* headline-small */
.date-cell .d { font-size: 24px; line-height: 32px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--md-on-surface); }
.date-cell .w { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: .5px; text-transform: uppercase; color: var(--md-on-surface-variant); }

.row-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
/* title-small */
.row-title { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .1px; color: var(--md-on-surface); }
.row-meta {
  display: flex; flex-wrap: wrap; gap: 2px 16px;
  font-size: 12px; line-height: 16px; letter-spacing: .4px;
  color: var(--md-on-surface-variant);
}
.row-meta span { display: inline-flex; align-items: center; gap: 4px; }
.row-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

/* M3 chips at the compact end: 8px corners, label-medium. */
.pill {
  display: inline-block;
  max-width: 100%;
  height: 24px;
  padding: 0 8px;
  border-radius: var(--md-shape-s);
  font-size: 12px;
  /* 22px + the 1px borders = the 24px chip height */
  line-height: 22px;
  font-weight: 500;
  letter-spacing: .5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  vertical-align: top;
  border: 1px solid transparent;
}
.pill-live { background: var(--live-c); color: var(--live-on); }
.pill-ticketing { background: var(--ticketing-c); color: var(--ticketing-on); }
.pill-built { background: var(--built-c); color: var(--built-on); }
.pill-new { background: var(--new-c); color: var(--new-on); }
.pill-later { background: var(--later-c); color: var(--later-on); }
.pill-cpd { background: var(--cpd-c); color: var(--cpd-on); }
.pill-type { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.pill-cat { background: transparent; color: var(--md-on-surface-variant); border-color: var(--md-outline-variant); font-weight: 400; }
.pill-local { background: transparent; color: var(--md-primary); border-color: var(--md-primary); }
.pill-ext { background: transparent; color: var(--md-on-surface-variant); border-color: var(--md-outline); }

.tickets { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--md-on-surface-variant); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tickets b { color: var(--md-on-surface); font-weight: 500; }

/* -------------------------------------------------------------- table view */
.table-wrap {
  overflow-x: auto;
  background: var(--md-surface-container-low);
  border-radius: var(--md-shape-m);
}
table { border-collapse: collapse; width: 100%; font-size: 14px; }

/* top: 0 — .table-wrap sets overflow-x, which forces overflow-y to compute to
   auto, so the wrapper is this header's scroll container. Any offset here
   pushes the header down from the table's own top edge and through the first
   row. */
thead th {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--md-surface-container-low);
  text-align: left;
  /* label-large */
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  letter-spacing: .1px;
  color: var(--md-on-surface);
  padding: 14px 16px;
  border-bottom: 1px solid var(--md-outline-variant);
  white-space: nowrap;
}
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, var(--md-surface-container-low)); }
thead th .arrow { color: var(--md-on-surface-variant); font-size: 9px; }
tbody td { padding: 14px 16px; border-bottom: 1px solid var(--md-outline-variant); vertical-align: top; letter-spacing: .25px; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
tbody tr:last-child td { border-bottom: 0; }
td.t-name { font-weight: 500; min-width: 250px; }
td.t-date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--md-on-surface); }
td.t-num { text-align: right; font-variant-numeric: tabular-nums; }
td.t-dim { color: var(--md-on-surface-variant); }

/* ------------------------------------------------------------------ empty */
.empty {
  background: var(--md-surface-container-low);
  border-radius: var(--md-shape-m);
  padding: 48px 24px;
  text-align: center;
  color: var(--md-on-surface-variant);
}
.empty h3 { font-size: 22px; line-height: 28px; color: var(--md-on-surface); margin-bottom: 8px; }

/* ------------------------------------------------- side sheet / drawer (M3) */
.scrim {
  position: fixed;
  inset: 0;
  background: color-mix(in srgb, var(--md-scrim) 32%, transparent);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--md-duration-medium) var(--md-easing-standard);
}
.scrim.is-open { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(460px, 100%);
  z-index: 61;
  background: var(--md-surface-container-low);
  border-radius: var(--md-shape-l) 0 0 var(--md-shape-l);
  box-shadow: var(--md-elevation-5);
  transform: translateX(100%);
  transition: transform var(--md-duration-long) var(--md-easing-decelerate);
  display: flex;
  flex-direction: column;
}
.panel.is-open { transform: none; }

.panel-head {
  padding: 20px 24px 12px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
/* headline-small */
.panel-head h2 { font-size: 24px; line-height: 32px; flex: 1; }
.panel-close {
  display: inline-flex; align-items: center; justify-content: center;
  border: 0;
  background: none;
  border-radius: var(--md-shape-full);
  width: 40px; height: 40px;
  cursor: pointer;
  color: var(--md-on-surface-variant);
  font-size: 20px;
  line-height: 1;
  flex: none;
}
.panel-close:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }

.panel-body { overflow-y: auto; padding: 0 24px 32px; display: flex; flex-direction: column; gap: 20px; }
.panel-pills { display: flex; flex-wrap: wrap; gap: 6px; }
/* body-large */
.panel-summary { font-size: 16px; line-height: 24px; letter-spacing: .5px; color: var(--md-on-surface-variant); }

.dl { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 10px 16px; font-size: 14px; letter-spacing: .25px; }
.dl dt { color: var(--md-on-surface-variant); font-size: 12px; line-height: 20px; letter-spacing: .4px; }
.dl dd { margin: 0; color: var(--md-on-surface); }
.dl dd.mono { font-family: var(--md-font-mono); font-size: 12px; word-break: break-word; color: var(--md-on-surface-variant); }

.panel-block { border-top: 1px solid var(--md-outline-variant); padding-top: 20px; }
.panel-block > .eyebrow { display: block; margin-bottom: 10px; }

.note {
  background: var(--md-surface-container-high);
  border-radius: var(--md-shape-m);
  padding: 12px 16px;
  font-size: 14px;
  line-height: 20px;
  letter-spacing: .25px;
  color: var(--md-on-surface-variant);
}

/* M3 filled button. */
.panel-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  padding: 0 24px;
  background: var(--md-primary);
  color: var(--md-on-primary);
  border-radius: var(--md-shape-full);
  text-decoration: none;
  font-weight: 500;
  font-size: 14px;
  letter-spacing: .1px;
}
.panel-link:hover { background: color-mix(in srgb, var(--md-on-primary) 8%, var(--md-primary)); color: var(--md-on-primary); box-shadow: var(--md-elevation-1); }

.siblings { display: flex; flex-direction: column; gap: 6px; }
.sibling {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 12px 16px;
  background: var(--md-surface-container);
  border: 0;
  border-radius: var(--md-shape-s);
  font-size: 14px;
  letter-spacing: .25px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  color: var(--md-on-surface);
}
.sibling:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, var(--md-surface-container)); }
.sibling .s-n { font-family: var(--md-font-mono); font-size: 12px; color: var(--md-on-surface-variant); flex: none; }
.sibling .s-d { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--md-on-surface-variant); font-size: 12px; flex: none; }
.sibling.is-current { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.sibling.is-current .s-n, .sibling.is-current .s-d { color: var(--md-on-secondary-container); }

/* ----------------------------------------------------------------- footer */
.foot {
  max-width: 1580px;
  margin: 0 auto;
  padding: 0 24px 32px;
  font-size: 12px;
  line-height: 16px;
  letter-spacing: .4px;
  color: var(--md-on-surface-variant);
  display: flex;
  gap: 8px 20px;
  flex-wrap: wrap;
  align-items: center;
}

.foot .by { display: inline-flex; align-items: center; gap: 8px; }

/* The mark is drawn as a background so the artwork is embedded once in the
   stylesheet and shared by the header and the footer, rather than carried
   twice as inline data URIs. */
.cc-link { display: inline-flex; align-items: center; border-radius: var(--md-shape-xs); }

.cc {
  display: block;
  height: 22px;
  aspect-ratio: 61 / 22;
  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}

/* One artwork per theme. Light is the default, so the white mark stays hidden
   until a dark theme resolves, in either of the two ways it can. */
.cc-dark { display: none; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .cc-light { display: none; }
  :root:not([data-theme="light"]) .cc-dark { display: block; }
}

:root[data-theme="dark"] .cc-light { display: none; }
:root[data-theme="dark"] .cc-dark { display: block; }

/* Separates the agency credit from the dashboard's own controls. */
.cc-head {
  margin-left: 4px;
  padding-left: 16px;
  border-left: 1px solid var(--md-outline-variant);
}

.rail-toggle { display: none; }

/* ------------------------------------------------------------ responsive */
@media (max-width: 1080px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail-toggle { display: inline-flex; }
  .rail-close { display: inline-flex; }

  /* An M3 modal navigation drawer: 16px on the trailing edge only. Inline, the
     rail opened below every result row - roughly 21,000px down on a phone - so
     the button looked dead. It is also taller than a phone screen, so it needs
     to scroll independently. */
  .rail {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(340px, 88vw);
    z-index: 62;
    max-height: none;
    overflow-y: auto;
    background: var(--md-surface-container-low);
    border-radius: 0 var(--md-shape-l) var(--md-shape-l) 0;
    box-shadow: var(--md-elevation-5);
    padding: 16px 12px 32px;
  }
  .rail[hidden] { display: none; }
}

@media (max-width: 700px) {
  .masthead-inner { padding: 8px 16px; gap: 12px; }
  .brand-icon { height: 32px; }
  .brand-text p { display: none; }
  .cc-head { display: none; }
  .shell { padding: 12px 16px 48px; gap: 16px; }
  .foot { padding: 0 16px 24px; }
  .row { grid-template-columns: 44px minmax(0, 1fr); gap: 12px; }
  .row-side { grid-column: 2; flex-direction: row; align-items: center; flex-wrap: wrap; }
  .date-cell .d { font-size: 22px; line-height: 28px; }
  .stat .v { font-size: 24px; line-height: 32px; }
  .search input { height: 44px; font-size: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

@media print {
  .masthead, .rail, .months, .toolbar, .scrim, .panel, .foot, .tools { display: none !important; }
  .shell { display: block; padding: 0; }
  .row { break-inside: avoid; box-shadow: none; border: 1px solid var(--md-outline-variant); }
  body { background: #fff; }
}
</style>
</head>

const ACTIVITIES = DATA.activities;

/* ------------------------------------------------------------------ utils */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const MONTH_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const STATUS_ORDER = ["live", "ticketing", "built", "new", "later"];
const STATUS_TEXT = {
  live: "Live on website",
  ticketing: "Needs ticketing",
  built: "Built, not public",
  new: "Not yet on website",
  later: "Later session",
  unknown: "Status not set",
};

// Only http(s) links are rendered. Every URL in the workbook is https today,
// but the column is free text, and a "javascript:" value typed into it would
// otherwise become a link that runs when a colleague clicks it.
function safeUrl(url) {
  const trimmed = String(url == null ? "" : url).trim();
  return /^https?:\/\//i.test(trimmed) ? trimmed : "";
}

function ukDate(iso) {
  if (!iso) return "TBC";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function longDate(iso, day) {
  if (!iso) return "Date TBC";
  const [y, m, d] = iso.split("-");
  return `${day ? day + " " : ""}${Number(d)} ${MONTH_SHORT[Number(m) - 1]} ${y}`;
}

/* ---------------------------------------------------------------- facets */
const FACETS = [
  { id: "rp", label: "Reporting period", get: (a) => [a.rp], order: ["RP1", "RP2", "RP3", "RP4"] },
  { id: "type", label: "Activity type", get: (a) => (a.type ? [a.type] : []) },
  { id: "format", label: "Format", get: (a) => [a.format] },
  { id: "scope", label: "Regional or local", get: (a) => (a.scope ? [a.scope] : []), order: ["Regional", "Local"] },
  { id: "registration", label: "Registration", get: (a) => (a.registration ? [a.registration] : []) },
  { id: "status", label: "Website status", get: (a) => [a.status], order: STATUS_ORDER, render: (v) => STATUS_TEXT[v] || v, swatch: true },
  { id: "pd", label: "PD category", get: (a) => (a.pd ? [a.pd] : []) },
  { id: "brochure", label: "Brochure category", get: (a) => (a.brochure ? [a.brochure] : []) },
  { id: "network", label: "Network", get: (a) => (a.network ? [a.network] : []) },
  { id: "venue", label: "Venue", get: (a) => (a.venue ? [a.venue] : []) },
  { id: "mailing", label: "Mailing list", get: (a) => a.mailing || [] },
  // A blank cell means nobody has said either way, so it stays out of the
  // counts rather than being reported as unprocessed.
  { id: "processed", label: "Processed for reports", order: ["Processed", "Not processed"],
    get: (a) => (a.processed == null ? [] : [a.processed ? "Processed" : "Not processed"]) },
  { id: "flags", label: "Needs attention", custom: true },
];

const FLAGS = {
  ticketing: { label: "Needs ticketing", test: (a) => a.status === "ticketing" },
  nourl:     { label: "No website link", test: (a) => !safeUrl(a.url) },
  tbc:       { label: "Venue or time to confirm", test: (a) => a.format === "Venue TBC" || a.time === "TO ADD" },
};

const state = {
  q: "",
  view: "schedule",
  sort: "date",
  dir: 1,
  sel: {},
  months: new Set(),
  hideLater: false,
};
FACETS.forEach((f) => (state.sel[f.id] = new Set()));

function matchesText(a) {
  if (!state.q) return true;
  const hay = [a.name, a.summary, a.notes, a.location, a.venue, a.brochure, a.pd,
               a.network, a.type, (a.mailing || []).join(" "), a.day, a.time,
               a.scope, a.registration]
    .join(" ").toLowerCase();
  return state.q.split(/\s+/).every((t) => hay.includes(t));
}

function passesFlags(a, except) {
  for (const [key, flag] of Object.entries(FLAGS)) {
    if (key === except) continue;
    if (state.sel.flags.has(key) && !flag.test(a)) return false;
  }
  return true;
}

/** Filter, optionally ignoring one facet (so its own option counts stay live). */
function filtered(ignore) {
  return ACTIVITIES.filter((a) => {
    if (state.hideLater && a.session && a.session > 1) return false;
    if (!matchesText(a)) return false;
    if (ignore !== "months" && state.months.size && !state.months.has(a.month)) return false;
    for (const facet of FACETS) {
      if (facet.id === ignore) continue;
      if (facet.custom) { if (!passesFlags(a)) return false; continue; }
      const chosen = state.sel[facet.id];
      if (!chosen.size) continue;
      if (!facet.get(a).some((v) => chosen.has(v))) return false;
    }
    if (ignore && ignore !== "flags" && ignore !== "months") {
      if (!passesFlags(a)) return false;
    }
    return true;
  });
}

/* ------------------------------------------------------------ rail render */
function renderFacets() {
  const html = FACETS.map((facet) => {
    const chosen = state.sel[facet.id];
    const pool = filtered(facet.id);
    let options;

    if (facet.custom) {
      options = Object.entries(FLAGS).map(([key, flag]) => ({
        value: key,
        label: flag.label,
        n: filtered("flags").filter((a) => passesFlags(a, key) && flag.test(a)).length,
      }));
    } else {
      const counts = new Map();
      pool.forEach((a) => facet.get(a).forEach((v) => counts.set(v, (counts.get(v) || 0) + 1)));
      // Keep chosen values visible even when the current filters zero them out.
      chosen.forEach((v) => { if (!counts.has(v)) counts.set(v, 0); });
      options = [...counts.keys()].sort((a, b) => {
        if (facet.order) return facet.order.indexOf(a) - facet.order.indexOf(b);
        return a.localeCompare(b);
      }).map((v) => ({ value: v, label: facet.render ? facet.render(v) : v, n: counts.get(v), swatch: facet.swatch }));
    }

    if (!options.length) return "";
    const open = chosen.size > 0 || ["rp", "type", "status"].includes(facet.id);

    return `<details class="facet" ${open ? "open" : ""} data-facet="${facet.id}">
      <summary>${esc(facet.label)}${chosen.size ? `<span class="count-on">${chosen.size}</span>` : ""}</summary>
      <div class="opts">${options.map((o) => `
        <label class="opt ${chosen.has(o.value) ? "is-on" : ""} ${o.n === 0 ? "is-empty" : ""}">
          <input type="checkbox" data-facet="${facet.id}" value="${esc(o.value)}" ${chosen.has(o.value) ? "checked" : ""}>
          ${o.swatch ? `<span class="swatch sw-${esc(o.value)}"></span>` : ""}
          <span class="label" title="${esc(o.label)}">${esc(o.label)}</span>
          <span class="n num">${o.n}</span>
        </label>`).join("")}</div>
    </details>`;
  }).join("");

  $("#facets").innerHTML = html + `
    <div class="facet" style="padding-top:14px">
      <label class="opt ${state.hideLater ? "is-on" : ""}">
        <input type="checkbox" id="hideLater" ${state.hideLater ? "checked" : ""}>
        <span class="label">Count programmes once</span>
      </label>
      <p style="margin:4px 0 0 6px;font-size:11.5px;color:var(--muted);line-height:1.4">
        Hides sessions 2 and 3 of multi-part CPD programmes &mdash; one booking covers them all.
      </p>
    </div>`;
}

/* ----------------------------------------------------------------- stats */
function renderStats(rows) {
  const distinct = rows.filter((a) => a.counts).length;
  const online = rows.filter((a) => a.format === "Online").length;
  const f2f = rows.filter((a) => a.format === "Face-to-face").length;
  const capacity = rows.reduce((sum, a) => sum + (a.tickets || 0), 0);
  const counted = rows.filter((a) => a.tickets != null).length;
  const elsewhere = rows.filter((a) => a.tickets == null && a.ticketsText).length;
  const live = rows.filter((a) => a.status === "live" || a.status === "ticketing").length;
  const ticketing = rows.filter((a) => a.status === "ticketing").length;
  // Anything not published and not a later session still needs a page. Later
  // sessions are covered by session 1's booking and never get one of their own,
  // so counting them here would overstate the backlog.
  const pending = rows.filter((a) => !["live", "ticketing", "later"].includes(a.status)).length;

  const card = (cls, value, key, sub, action) => `
    <${action ? "button" : "div"} class="stat ${cls}" ${action ? `type="button" data-stat="${action}"` : ""}>
      <span class="v num">${value}</span>
      <span class="k">${key}</span>
      ${sub ? `<span class="sub">${sub}</span>` : ""}
    </${action ? "button" : "div"}>`;

  $("#stats").innerHTML = [
    card("tone-primary", distinct, "Activities", `${rows.length} individual sessions`),
    card("tone-secondary", online, "Online", `${Math.round(online / (rows.length || 1) * 100)}% of sessions`, "online"),
    card("tone-tertiary", f2f, "Face-to-face", f2f ? `${new Set(rows.filter((a) => a.venue).map((a) => a.venue)).size} venues` : "&mdash;", "f2f"),
    card("", capacity.toLocaleString("en-GB"), "Ticket capacity",
      `across ${counted} of ${rows.length} sessions`
      + (elsewhere ? `<br>${elsewhere} booked externally` : "")),
    card("tone-live", live, "Live on website",
      `${pending} still to publish`
      + (ticketing ? `<br><span class="sub-ticketing">${ticketing} live, not yet ticketed</span>` : ""),
      "live"),
  ].join("");
}

/* ------------------------------------------------------------ month strip */
// Which reporting period each month sits in, taken from the data rather than
// hard-coded, so it stays right if the periods ever move.
const MONTH_PERIOD = new Map();
ACTIVITIES.forEach((a) => {
  if (a.month && a.rp && !MONTH_PERIOD.has(a.month)) MONTH_PERIOD.set(a.month, a.rp);
});
const PERIOD_RANGE = new Map((DATA.periods || []).map((p) => [p.id, p.from + " to " + p.to]));

function renderMonths(rows) {
  const all = new Map();
  ACTIVITIES.forEach((a) => { if (a.month) all.set(a.month, (all.get(a.month) || 0) + 1); });
  const hits = new Map();
  rows.forEach((a) => { if (a.month) hits.set(a.month, (hits.get(a.month) || 0) + 1); });
  const keys = [...all.keys()].sort();
  const peak = Math.max(...all.values(), 1);

  const bar = (key) => {
    const [y, m] = key.split("-");
    const total = all.get(key) || 0;
    const hit = hits.get(key) || 0;
    const on = state.months.has(key);
    return `<button type="button" class="bar ${on ? "is-on" : ""} ${hit === 0 ? "is-zero" : ""}"
        data-month="${key}" aria-pressed="${on}"
        title="${MONTH_SHORT[Number(m) - 1]} ${y}: ${hit} of ${total} shown">
      <span class="c num">${hit}</span>
      <span class="col"><span class="fill" style="height:${Math.max(hit / peak * 100, hit ? 6 : 0)}%"></span></span>
      <span class="m">${MONTH_SHORT[Number(m) - 1]}</span>
    </button>`;
  };

  // Consecutive months in the same period form one band.
  const bands = [];
  keys.forEach((key) => {
    const rp = MONTH_PERIOD.get(key) || "";
    const last = bands[bands.length - 1];
    if (last && last.rp === rp) last.keys.push(key);
    else bands.push({ rp, keys: [key] });
  });

  $("#bars").innerHTML = bands.map((band) => {
    const on = state.sel.rp.has(band.rp);
    const range = PERIOD_RANGE.get(band.rp);
    // Grow by month count so bars stay the same width across bands.
    return `<div class="rp-group" style="flex:${band.keys.length} 1 0">
      <div class="rp-bars">${band.keys.map(bar).join("")}</div>
      ${band.rp ? `<button type="button" class="rp-label ${on ? "is-on" : ""}" data-rp="${esc(band.rp)}"
          aria-pressed="${on}" title="${esc(band.rp)}${range ? ", " + esc(range) : ""}">${esc(band.rp)}</button>` : ""}
    </div>`;
  }).join("");
}

/* ---------------------------------------------------------------- results */
function sorted(rows) {
  const copy = rows.slice();
  const key = state.sort;
  copy.sort((a, b) => {
    let x, y;
    if (key === "tickets") { x = a.tickets || 0; y = b.tickets || 0; }
    else if (key === "date") { x = (a.date || "9999") + String(a.timeSort).padStart(4, "0"); y = (b.date || "9999") + String(b.timeSort).padStart(4, "0"); }
    else { x = String(a[key] || "").toLowerCase(); y = String(b[key] || "").toLowerCase(); }
    if (x < y) return -1 * state.dir;
    if (x > y) return 1 * state.dir;
    return a.name.localeCompare(b.name);
  });
  return copy;
}

function rowCard(a) {
  const [, , d] = (a.date || "--,--,--").split("-");
  const cat = a.network ? `${a.network} Network` : a.brochure;
  return `<button type="button" class="row st-${a.status}" data-id="${a.id}">
    <span class="date-cell">
      <span class="d num">${a.date ? Number(d) : "&mdash;"}</span>
      <span class="w">${esc((a.day || "TBC").slice(0, 3))}</span>
    </span>
    <span class="row-body">
      <span class="row-title">${esc(a.name)}</span>
      <span class="row-meta">
        <span>${esc(a.time || "Time TBC")}</span>
        <span>${a.format === "Online" ? "Online" : esc(a.venue || a.location || "Venue TBC")}</span>
        ${a.tickets ? `<span class="num">${a.tickets} tickets</span>` : ""}
      </span>
      <span class="row-tags">
        <span class="pill pill-type">${esc(a.type || "Activity")}</span>
        ${cat ? `<span class="pill pill-cat">${esc(cat)}</span>` : ""}
        ${a.cpd === "Yes" ? `<span class="pill pill-cpd">CPD bundle</span>` : ""}
        ${a.scope === "Local" ? `<span class="pill pill-local">Local</span>` : ""}
        ${a.registration && a.registration !== "Website" ? `<span class="pill pill-ext">${esc(a.registration)}</span>` : ""}
      </span>
    </span>
    <span class="row-side">
      <span class="pill pill-${a.status}">${esc(STATUS_TEXT[a.status] || a.status)}</span>
      ${a.session ? `<span class="tickets">Session <b>${a.session} of ${a.parts}</b></span>` : ""}
    </span>
  </button>`;
}

const COLUMNS = [
  { key: "date", label: "Date", cls: "t-date", cell: (a) => ukDate(a.date) },
  { key: "day", label: "Day", cls: "t-dim", cell: (a) => a.day },
  { key: "time", label: "Time", cls: "t-dim", cell: (a) => a.time },
  { key: "name", label: "Activity", cls: "t-name", cell: (a) => esc(a.name) },
  { key: "type", label: "Type", cls: "", cell: (a) => a.type },
  { key: "format", label: "Location", cls: "t-dim", cell: (a) => a.format === "Online" ? "Online" : (a.location || "TBC") },
  { key: "tickets", label: "Tickets", cls: "t-num",
    cell: (a) => (a.tickets != null ? a.tickets : (a.ticketsText || "")) },
  { key: "brochure", label: "Brochure category", cls: "t-dim", cell: (a) => a.brochure },
  { key: "pd", label: "PD category", cls: "t-dim", cell: (a) => a.pd },
  { key: "status", label: "Status", cls: "", cell: (a) => `<span class="pill pill-${a.status}">${esc(STATUS_TEXT[a.status] || a.status)}</span>` },
  { key: "workflows", label: "Workflows", cls: "t-dim", cell: (a) => a.workflows || "&mdash;" },
  { key: "scope", label: "Regional/local", cls: "t-dim", cell: (a) => a.scope },
  { key: "registration", label: "Registration", cls: "t-dim", cell: (a) => a.registration },
  { key: "processed", label: "Reports", cls: "t-dim",
    cell: (a) => (a.processed == null ? "" : (a.processed ? "Processed" : "Not processed")) },
];

function renderResults(rows) {
  const target = $("#results");
  if (!rows.length) {
    target.innerHTML = `<div class="empty">
      <h3>Nothing matches those filters</h3>
      <p>Try clearing a filter or widening your search.</p>
    </div>`;
    return;
  }

  if (state.view === "table") {
    const head = COLUMNS.map((c) => {
      const on = state.sort === c.key;
      return `<th class="sortable ${c.cls}" data-sort="${c.key}" aria-sort="${on ? (state.dir === 1 ? "ascending" : "descending") : "none"}">
        ${esc(c.label)} <span class="arrow">${on ? (state.dir === 1 ? "▲" : "▼") : "△"}</span></th>`;
    }).join("");
    const body = sorted(rows).map((a) => `<tr data-id="${a.id}">${
      COLUMNS.map((c) => `<td class="${c.cls}">${c.cell(a) == null || c.cell(a) === "" ? "&mdash;" : (c.key === "name" || c.key === "status" ? c.cell(a) : esc(c.cell(a)))}</td>`).join("")
    }</tr>`).join("");
    target.innerHTML = `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    return;
  }

  const groups = new Map();
  sorted(rows).forEach((a) => {
    const key = a.month || "tbc";
    if (!groups.has(key)) groups.set(key, { label: a.monthLabel, items: [] });
    groups.get(key).items.push(a);
  });

  target.innerHTML = [...groups.entries()].map(([key, group]) => `
    <section class="month-group">
      <div class="month-rule">
        <h2>${esc(group.label)}</h2>
        <span class="n">${group.items.length} ${group.items.length === 1 ? "activity" : "activities"}</span>
      </div>
      <div class="rows">${group.items.map(rowCard).join("")}</div>
    </section>`).join("");
}

/* ----------------------------------------------------------------- chips */
function renderChips() {
  const chips = [];
  FACETS.forEach((facet) => {
    state.sel[facet.id].forEach((value) => {
      // A hand-edited or truncated shared link can carry a value we do not
      // know; show it verbatim rather than throwing and blanking the page.
      const flag = facet.custom ? FLAGS[value] : null;
      const label = facet.custom
        ? (flag ? flag.label : value)
        : (facet.render ? facet.render(value) : value);
      chips.push(`<button class="chip" type="button" data-drop="${facet.id}" data-value="${esc(value)}">${esc(label)}<span class="x">&times;</span></button>`);
    });
  });
  state.months.forEach((m) => {
    const [y, mm] = m.split("-");
    chips.push(`<button class="chip" type="button" data-drop="months" data-value="${m}">${MONTH_SHORT[Number(mm) - 1]} ${y}<span class="x">&times;</span></button>`);
  });
  $("#chips").innerHTML = chips.join("");
}

/* ---------------------------------------------------------------- render */
function render() {
  const rows = filtered();
  renderFacets();
  renderStats(rows);
  renderMonths(rows);
  renderChips();
  renderResults(rows);

  const total = ACTIVITIES.length;
  const distinct = rows.filter((a) => a.counts).length;
  $("#count").innerHTML = rows.length === total
    ? `<strong>${total}</strong> sessions &middot; <strong>${distinct}</strong> distinct activities`
    : `<strong>${rows.length}</strong> of ${total} sessions &middot; <strong>${distinct}</strong> distinct activities`;
  $("#qClear").hidden = !state.q;
  writeHash();
}

/* --------------------------------------------------------------- details */
let lastFocus = null;

function openPanel(id) {
  const a = ACTIVITIES.find((x) => x.id === id);
  if (!a) return;
  lastFocus = document.activeElement;

  const siblings = a.parts > 0 ? ACTIVITIES.filter((x) => x.key === a.key).sort((x, y) => (x.session || 0) - (y.session || 0)) : [];
  const rowsHtml = (pairs) => `<dl class="dl">${pairs.filter((p) => p[1]).map(
    ([k, v, cls]) => `<dt>${esc(k)}</dt><dd class="${cls || ""}">${cls === "mono" ? esc(v) : v}</dd>`).join("")}</dl>`;

  $("#panelTitle").textContent = a.name;
  $("#panelBody").innerHTML = `
    <div class="panel-pills">
      <span class="pill pill-${a.status}">${esc(STATUS_TEXT[a.status] || a.status)}</span>
      <span class="pill pill-type">${esc(a.type || "Activity")}</span>
      <span class="pill pill-cat">${esc(a.rp)}</span>
      ${a.cpd === "Yes" ? `<span class="pill pill-cpd">CPD bundle</span>` : ""}
    </div>

    ${a.summary ? `<p class="panel-summary">${esc(a.summary)}</p>` : ""}

    ${rowsHtml([
      ["When", `${esc(longDate(a.date, a.day))}${a.time ? `<br>${esc(a.time)}` : ""}`],
      ["Where", a.format === "Online" ? "Online" : esc(a.location || "Venue TBC")],
      ["Reach", esc(a.scope)],
      ["Registration", esc(a.registration)],
      ["Tickets", a.tickets != null
        ? `<span class="num">${a.tickets}</span>`
        : (a.ticketsText ? esc(a.ticketsText) : "")],
      ["Brochure", esc(a.brochure)],
      ["PD category", esc(a.pd)],
      ["Network", esc(a.network)],
      ["Mailing list", esc((a.mailing || []).join(" &middot; ")).replace(/&amp;middot;/g, "&middot;")],
      ["CPD bundle", esc(a.cpd)],
      ["Workflows", a.workflows === "Yes" ? "Configured" : `<span style="color:var(--rust);font-weight:600">Not configured</span>`],
      ["Reports", a.processed == null ? "" : (a.processed ? "Processed" : "Not processed")],
    ])}

    ${a.notes ? `<div class="panel-block"><span class="eyebrow">Notes</span><p class="note">${esc(a.notes)}</p></div>` : ""}

    ${siblings.length > 1 ? `<div class="panel-block">
      <span class="eyebrow">Programme sessions</span>
      <div class="siblings">${siblings.map((s) => `
        <button type="button" class="sibling ${s.id === a.id ? "is-current" : ""}" data-id="${s.id}">
          <span class="s-n">${s.session ? "S" + s.session : "—"}</span>
          <span>${esc(s.stem === s.name ? s.name : "Session " + (s.session || "?"))}</span>
          <span class="s-d num">${esc(ukDate(s.date))}</span>
        </button>`).join("")}</div>
    </div>` : ""}

    <div class="panel-block">
      <span class="eyebrow">HubSpot list tags</span>
      ${rowsHtml([
        ["Registered", a.tags.registered, "mono"],
        ["Attended", a.tags.attended, "mono"],
        ["Activity type", a.tags.type, "mono"],
        ["PD category", a.tags.pd, "mono"],
        ["Network", a.tags.network, "mono"],
      ])}
    </div>

    ${safeUrl(a.url) ? `<div class="panel-block"><a class="panel-link" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">
      View course page
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
        <path d="M7 17L17 7M9 7h8v8"></path></svg>
    </a></div>` : `<div class="panel-block"><p style="color:var(--muted);font-size:13.5px;margin:0">No website page linked yet.</p></div>`}`;

  $("#panel").classList.add("is-open");
  $("#panel").focus();
  updateScrim();
}

function closePanel() {
  if (!$("#panel").classList.contains("is-open")) return;
  $("#panel").classList.remove("is-open");
  updateScrim();
  if (lastFocus) lastFocus.focus();
}

/* ------------------------------------------------------------ filter drawer */
// Below this width the rail is a drawer over the page; above it, a fixed
// column that is always on screen.
const narrow = matchMedia("(max-width: 1080px)");

function railOpen() {
  return narrow.matches && !$("#rail").hasAttribute("hidden");
}

function updateScrim() {
  const open = railOpen() || $("#panel").classList.contains("is-open");
  $("#scrim").classList.toggle("is-open", open);
}

function setRail(open, moveFocus) {
  const rail = $("#rail");
  open ? rail.removeAttribute("hidden") : rail.setAttribute("hidden", "");
  $("#railToggle").setAttribute("aria-expanded", String(open));
  updateScrim();
  // Focus follows the drawer only when someone opens or closes it. On a desktop
  // load the rail is just part of the page, and focusing it there paints a
  // focus ring around the whole column before anyone has touched anything.
  if (!moveFocus || !narrow.matches) return;
  open ? rail.focus() : $("#railToggle").focus();
}

// Crossing the breakpoint resets the rail to that layout's default, so a rail
// hidden on a phone can never stay hidden on a desktop, where nothing reopens it.
function applyLayout() {
  setRail(!narrow.matches);
}

/* -------------------------------------------------------- shareable state */
function writeHash() {
  const parts = [];
  if (state.q) parts.push("q=" + encodeURIComponent(state.q));
  FACETS.forEach((f) => { if (state.sel[f.id].size) parts.push(f.id + "=" + [...state.sel[f.id]].map(encodeURIComponent).join("|")); });
  if (state.months.size) parts.push("months=" + [...state.months].join("|"));
  if (state.hideLater) parts.push("once=1");
  if (state.view !== "schedule") parts.push("view=" + state.view);
  const hash = parts.join("&");
  try {
    history.replaceState(null, "", hash ? "#" + hash : location.pathname + location.search);
  } catch (err) {
    // Sandboxed or opaque origin: shareable links are unavailable, filters still work.
  }
}

function readHash() {
  const hash = location.hash.replace(/^#/, "");
  if (!hash) return;
  hash.split("&").forEach((pair) => {
    const [key, raw = ""] = pair.split("=");
    const value = decodeURIComponent(raw);
    if (key === "q") state.q = value.toLowerCase();
    else if (key === "months") value.split("|").forEach((v) => state.months.add(v));
    else if (key === "once") state.hideLater = value === "1";
    else if (key === "view") state.view = value === "table" ? "table" : "schedule";
    else if (key === "flags") value.split("|").forEach((v) => {
      if (Object.prototype.hasOwnProperty.call(FLAGS, v)) state.sel.flags.add(v);
    });
    else if (state.sel[key]) value.split("|").forEach((v) => state.sel[key].add(decodeURIComponent(v)));
  });
  $("#q").value = state.q;
  document.querySelectorAll(".segmented button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
}

/* -------------------------------------------------------------- listeners */
$("#q").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
$("#qClear").addEventListener("click", () => { state.q = ""; $("#q").value = ""; $("#q").focus(); render(); });

$("#facets").addEventListener("change", (e) => {
  const input = e.target;
  if (input.id === "hideLater") { state.hideLater = input.checked; render(); return; }
  const facet = input.dataset.facet;
  if (!facet) return;
  const set = state.sel[facet];
  input.checked ? set.add(input.value) : set.delete(input.value);
  render();
});

$("#bars").addEventListener("click", (e) => {
  const band = e.target.closest(".rp-label");
  if (band) { toggle("rp", band.dataset.rp); render(); return; }
  const bar = e.target.closest(".bar");
  if (!bar) return;
  state.months.has(bar.dataset.month) ? state.months.delete(bar.dataset.month) : state.months.add(bar.dataset.month);
  render();
});

$("#chips").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  if (chip.dataset.drop === "months") state.months.delete(chip.dataset.value);
  else state.sel[chip.dataset.drop].delete(chip.dataset.value);
  render();
});

$("#stats").addEventListener("click", (e) => {
  const stat = e.target.closest("[data-stat]");
  if (!stat) return;
  const map = {
    online: () => toggle("format", "Online"),
    f2f: () => toggle("format", "Face-to-face"),
    // The tile counts both published states, so clicking it selects both.
    live: () => {
      const both = ["live", "ticketing"];
      const on = both.every((v) => state.sel.status.has(v));
      both.forEach((v) => (on ? state.sel.status.delete(v) : state.sel.status.add(v)));
    },
  };
  map[stat.dataset.stat]?.();
  render();
});

function toggle(facet, value) {
  const set = state.sel[facet];
  set.has(value) ? set.delete(value) : set.add(value);
}

$("#results").addEventListener("click", (e) => {
  const hit = e.target.closest("[data-id]");
  if (hit) openPanel(hit.dataset.id);
});

$("#results").addEventListener("click", (e) => {
  const th = e.target.closest("th[data-sort]");
  if (!th) return;
  const key = th.dataset.sort;
  if (state.sort === key) state.dir *= -1;
  else { state.sort = key; state.dir = 1; }
  render();
}, true);

document.querySelectorAll(".segmented button").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.view = btn.dataset.view;
    state.sort = state.view === "table" ? state.sort : "date";
    document.querySelectorAll(".segmented button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b === btn)));
    render();
  });
});

$("#panelBody").addEventListener("click", (e) => {
  const sib = e.target.closest(".sibling");
  if (sib) openPanel(sib.dataset.id);
});

$("#panelClose").addEventListener("click", closePanel);
$("#scrim").addEventListener("click", () => { closePanel(); if (railOpen()) setRail(false, true); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closePanel(); if (railOpen()) setRail(false, true); }
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});

$("#resetBtn").addEventListener("click", () => {
  state.q = "";
  $("#q").value = "";
  state.months.clear();
  state.hideLater = false;
  FACETS.forEach((f) => state.sel[f.id].clear());
  render();
});

$("#railToggle").addEventListener("click", () => setRail(!railOpen(), true));
$("#railClose").addEventListener("click", () => setRail(false, true));
narrow.addEventListener("change", applyLayout);

$("#themeBtn").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const dark = current
    ? current === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("sph-theme", next); } catch (err) { /* storage blocked */ }
});

/* ------------------------------------------------------------------- boot */
try {
  const saved = localStorage.getItem("sph-theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
} catch (err) { /* storage blocked */ }

applyLayout();

$("#genDate").textContent = DATA.generated;
$("#year").textContent = DATA.year;
readHash();
render();
</script>
</body>
</html>
